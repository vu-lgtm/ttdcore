<html lang="vi">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#ff7043 0%,#e64a19 100%);min-height:100vh;padding:20px;color:#333;}
.container{max-width:1280px;margin:0 auto;background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.1);padding:30px;}
.hidden{display:none !important;}
.login-box{max-width:480px;margin:40px auto;text-align:center;}
.login-box h1{font-size:28px;margin-bottom:8px;}
.login-box p{color:#666;margin-bottom:28px;font-size:14px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid #eee;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.top-bar h1{font-size:22px;}
.top-bar p{color:#888;font-size:13px;margin-top:2px;}
.user-info{display:flex;align-items:center;gap:12px;}
.user-badge{background:linear-gradient(135deg,#ff7043,#e64a19);color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;}
.btn{padding:9px 18px;border:2px solid #e0e0e0;background:white;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:all 0.2s;color:#555;}
.btn:hover{border-color:#ff7043;color:#ff7043;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#ff7043,#e64a19);border-color:transparent;color:white;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,112,67,0.3);color:white;}
.btn-danger{color:#c0392b;border-color:#f8d7da;}
.btn-danger:hover{border-color:#c0392b;}
.btn-mini{padding:4px 10px;font-size:11px;border:1px solid #e0e0e0;background:white;border-radius:5px;cursor:pointer;color:#ff7043;font-weight:500;}
.btn-mini:hover{background:#ff7043;color:white;border-color:#ff7043;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;background:white;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#ff7043;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:linear-gradient(135deg,#ff7043,#e64a19);padding:18px;border-radius:10px;color:white;}
.stat-card.blue{background:linear-gradient(135deg,#1976d2,#1565c0);}
.stat-card.green{background:linear-gradient(135deg,#43a047,#2e7d32);}
.stat-card.purple{background:linear-gradient(135deg,#8e24aa,#6a1b9a);}
.stat-label{font-size:12px;opacity:0.9;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:700;}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;}
.search-box input:focus{outline:none;border-color:#ff7043;}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
.view-toggle{display:flex;border:2px solid #e0e0e0;border-radius:8px;overflow:hidden;}
.view-toggle button{padding:8px 12px;border:none;background:white;cursor:pointer;font-size:15px;color:#888;}
.view-toggle button.active{background:#ff7043;color:white;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.item-card{border:2px solid #eee;border-radius:10px;padding:16px;cursor:pointer;transition:all .18s;background:white;}
.item-card:hover{border-color:#ff7043;transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,112,67,0.1);}
.ship-table{width:100%;border-collapse:collapse;background:white;border:2px solid #eee;border-radius:10px;overflow:hidden;}
.ship-table th{background:#fff3e0;padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:#e65100;border-bottom:2px solid #ffe0b2;white-space:nowrap;}
.ship-table td{padding:11px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;}
.ship-table tr:last-child td{border-bottom:none;}
.ship-table tr:hover td{background:#fffaf5;cursor:pointer;}
.status-pill{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;white-space:nowrap;}
.st-booking{background:#e3f2fd;color:#1565c0;}
.st-loading{background:#fff3cd;color:#856404;}
.st-customs{background:#f3e5f5;color:#6a1b9a;}
.st-shipped{background:#e8f5e9;color:#2e7d32;}
.st-done{background:#d4edda;color:#155724;}
.type-badge{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;}
.type-robusta{background:#4e342e;color:white;}
.type-arabica{background:#2e7d32;color:white;}
.type-other{background:#5c6bc0;color:white;}
.detail-card{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:20px;margin-bottom:16px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.detail-item .d-label{font-size:11px;color:#888;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.detail-item .d-value{font-size:14px;color:#333;font-weight:500;}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.doc-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px solid #eee;border-radius:8px;cursor:pointer;transition:all .15s;background:white;}
.doc-item:hover{border-color:#ff7043;}
.doc-item.checked{background:#e8f5e9;border-color:#a5d6a7;}
.doc-check{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-item.checked .doc-check{background:#43a047;border-color:#43a047;color:white;}
.doc-label{font-size:13px;color:#333;}
.doc-item.checked .doc-label{color:#2e7d32;font-weight:600;}
.doc2{border:2px solid #eee;border-radius:8px;padding:10px 12px;background:white;transition:all .15s;}
.doc2.checked{background:#e8f5e9;border-color:#a5d6a7;}
.doc2-head{display:flex;align-items:center;gap:8px;}
.doc2-check{width:18px;height:18px;border-radius:4px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:12px;}
.doc2.checked .doc2-check{background:#43a047;border-color:#43a047;color:white;}
.doc2-num{width:20px;height:20px;border-radius:50%;background:#fff3e0;color:#e65100;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc2-label{flex:1;font-size:13px;color:#333;}
.doc2.checked .doc2-label{color:#2e7d32;font-weight:600;}
.doc2-add{border:1px solid #ffcc80;background:#fff8f0;color:#e65100;border-radius:5px;cursor:pointer;font-size:12px;padding:2px 7px;flex-shrink:0;}
.doc2-add:hover{background:#ff7043;color:white;border-color:#ff7043;}
.doc2-files{margin-top:8px;display:flex;flex-direction:column;gap:4px;padding-left:28px;}
.doc2-file{display:flex;align-items:center;gap:6px;font-size:11px;background:#f8f9fc;border:1px solid #eee;border-radius:5px;padding:3px 7px;}
.doc2-fname{flex:1;color:#1976d2;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc2-fname:hover{text-decoration:underline;}
.doc-grid.drag{outline:2px dashed #ff7043;outline-offset:4px;border-radius:10px;}
.att-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.att-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f9fc;border:1px solid #eee;border-radius:8px;}
.att-thumb{width:44px;height:44px;border-radius:6px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee;font-size:20px;}
.att-thumb img{width:100%;height:100%;object-fit:cover;}
.att-name{flex:1;font-size:13px;color:#1976d2;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.att-name:hover{text-decoration:underline;}
.att-meta{font-size:11px;color:#999;white-space:nowrap;}
.fee-table{width:100%;border-collapse:collapse;margin-top:6px;}
.fee-table td{padding:7px 8px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;}
.fee-sec td{background:#fff3e0;color:#e65100;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:8px;}
.fee-paid{background:#f1f8f2;}
.fee-name{color:#333;}
.fee-en{font-size:11px;color:#999;}
.fee-amt{width:150px;text-align:right;}
.fee-amt input{width:100%;padding:6px 8px;border:2px solid #e0e0e0;border-radius:6px;font-size:13px;text-align:right;font-family:inherit;}
.fee-amt input:focus{outline:none;border-color:#ff7043;}
.fee-del{width:28px;text-align:center;}
.fee-del button{border:none;background:none;color:#c0392b;cursor:pointer;font-size:14px;opacity:.5;}
.fee-del button:hover{opacity:1;}
.fee-total td{font-weight:700;color:#e65100;border-top:2px solid #ffe0b2;font-size:14px;padding:10px 8px;}
.drop-zone{border:2px dashed #ffcc80;border-radius:10px;padding:18px;text-align:center;background:#fff8f0;cursor:pointer;margin-top:12px;}
.drop-zone:hover{border-color:#ff7043;background:#fff3e0;}
.drop-zone.drag{border-color:#ff7043;background:#ffe0b2;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:white;border-radius:12px;padding:28px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;}
.modal h2{font-size:20px;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.section-title{font-size:13px;font-weight:600;color:#e65100;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.preview-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:center;justify-content:center;}
.preview-backdrop iframe{width:90vw;height:88vh;border:none;border-radius:8px;background:white;}
.preview-backdrop img{max-width:90vw;max-height:85vh;border-radius:8px;}
.preview-close{position:absolute;top:16px;right:20px;color:white;font-size:32px;cursor:pointer;background:none;border:none;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#ff7043;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:#666;}
.empty-state{text-align:center;padding:60px 20px;color:#999;}
.empty-state .ico{font-size:48px;margin-bottom:12px;}
.back-btn{padding:9px 18px;border:2px solid #e0e0e0;background:white;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;color:#555;margin-bottom:16px;}
@media(max-width:768px){.container{padding:16px;}.stats{grid-template-columns:1fr 1fr;}.detail-grid{grid-template-columns:1fr 1fr;}.form-row,.form-row-3{grid-template-columns:1fr;}}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:#ffcc80;border-radius:4px;}
</style>
</head>

function fmtSize(b){if(!b)return'';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
function fmtDate(d){return d?new Date(d).toLocaleDateString('vi-VN'):'';}

function getFees(s){
  const c=s.costs;
  if(c&&Array.isArray(c.items)&&c.items.length)return c.items;
  return DEFAULT_FEES.map((f,i)=>({id:'fee_'+i,sec:f.sec,label:f.label,en:f.en,amount:0}));
}
function feesTotal(items){return items.reduce((a,f)=>a+(Number(f.amount)||0),0);}
function costProgress(s){const items=getFees(s);const paid=items.filter(f=>Number(f.amount)>0).length;return{paid,total:items.length,sum:feesTotal(items)};}

// ===== AUTH =====
async function loginWithGoogle(){
  const errEl=document.getElementById('loginError'),btn=document.getElementById('loginBtn');
  errEl.style.display='none';btn.disabled=true;showLoading('Đang chuyển hướng...');
  try{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href,queryParams:{hd:'ttdglobal.vn'}}});if(error)throw error;}
  catch(e){errEl.textContent='Lỗi: '+e.message;errEl.style.display='block';btn.disabled=false;hideLoading();}
}
async function loadCurrentUser(authUser){
  let profile=null;
  const{data:byId}=await sb.from('profiles').select('*').eq('id',authUser.id).single();
  if(byId){profile=byId;}else{const{data:byEmail}=await sb.from('profiles').select('*').eq('email',authUser.email).maybeSingle();if(byEmail){await sb.from('profiles').update({id:authUser.id}).eq('email',authUser.email);profile=byEmail;}}
  if(!profile){await sb.auth.signOut();alert('Tài khoản chưa được cấu hình.');return;}
  currentUser={id:authUser.id,email:authUser.email,name:profile.name,role:profile.role};
  showMainApp();
}
async function logout(){await sb.auth.signOut();currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
function showMainApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userBadge').textContent=`${currentUser.name} · ${isAdmin()?'👑 Admin':DEPTS[currentUser.role]||currentUser.role}`;
  if(canEdit())document.getElementById('btnAdd').classList.remove('hidden');
  loadData();
}

// ===== DATA =====
async function loadData(){
  showLoading('Đang tải lô hàng...');
  try{const{data,error}=await sb.from('logistics_shipments').select('*').order('created_at',{ascending:false});if(error)throw error;allShips=data||[];renderStats();renderList();}
  catch(e){document.getElementById('listContainer').innerHTML=`<div class="empty-state"><p>Lỗi: ${e.message}</p><p style="font-size:12px;color:#aaa;margin-top:8px;">Nếu bảng chưa tồn tại, chạy SQL tạo bảng logistics_shipments.</p></div>`;}
  finally{hideLoading();}
}

  const s=currentShip;
  const docs=s.doc_status||{};
  const allAtt=s.attachments||[];
  // Mỗi ô chứng từ: số thứ tự, tick, nút đính file riêng, danh sách file của ô
  const docHtml=DOC_LIST.map((d,di)=>{

        ${canEdit()?`<button class="doc2-add" onclick="triggerDocUpload('${s.id}','${d.key}')" title="Đính file cho mục này">📎${files.length?' '+files.length:''}</button>`:''}
      </div>
      ${files.length?`<div class="doc2-files">${chips}</div>`:''}
    </div>`;
  }).join('');

  const genFiles=allAtt.map((a,i)=>({a,i})).filter(x=>!x.a.doc);

  const zipFiles=allAtt.map((a,i)=>({a,i})).filter(x=>x.a.doc==='_zip');
  const zipHtml=zipFiles.map(({a,i})=>`<div class="att-row"><div class="att-thumb">🗜️</div><span class="att-name" onclick="downloadDriveFile('${esc(a.fileId||'')}')">${esc(a.title)}</span><span class="att-meta">${a.size?fmtSize(a.size):''}${a.user?' · '+esc(a.user):''}</span><button class="btn-mini" onclick="downloadDriveFile('${esc(a.fileId||'')}')">⬇ Tải</button>${canEdit()?`<button class="btn-mini" style="color:#c0392b;" onclick="removeAtt(${i})">✕</button>`:''}</div>`).join('')||'<span style="color:#aaa;font-size:13px;">Chưa có file nén</span>';
  const attHtml=genFiles.map(({a,i})=>{
    const isImg=(a.mime||'').startsWith('image/')||/\.(jpg|jpeg|png|gif|webp)$/i.test(a.title||'');
    const isPdf=(a.mime==='application/pdf')||/\.pdf$/i.test(a.title||'');
    const thumb=isImg&&a.url?`<img src="${esc(a.url)}">`:isPdf?'📕':/\.(docx?|rtf)$/i.test(a.title||'')?'📄':/\.(xlsx?|csv)$/i.test(a.title||'')?'📊':'📎';
    return`<div class="att-row"><div class="att-thumb">${thumb}</div><span class="att-name" onclick="previewDoc('${esc(a.previewUrl||a.url)}','${esc(a.url||'')}')">${esc(a.title)}</span><span class="att-meta">${a.size?fmtSize(a.size):''}${a.user?' · '+esc(a.user):''}</span>${canEdit()?`<button class="btn-mini" style="color:#c0392b;" onclick="removeAtt(${i})">✕</button>`:''}</div>`;
  }).join('')||'<span style="color:#aaa;font-size:13px;">Chưa có file</span>';
  const etd=fmtDate(s.etd)||'—', eta=fmtDate(s.eta)||'—';

    <div class="detail-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;">

        </div>

      <div class="detail-grid">

        <div class="detail-item"><div class="d-label">NCC</div><div class="d-value">${esc(s.supplier||'—')}</div></div>

      <div class="att-list">${attHtml}</div>

  const drop=document.getElementById('dropZone');

// ===== CHI PHÍ LÔ HÀNG =====
let editingCosts=false;
function costTotal(s){const c=s.costs||{};let t=0;COST_GROUPS.forEach(g=>g.items.forEach(it=>{t+=parseFloat(c[it.key])||0;}));return t;}
function groupTotal(s,g){const c=s.costs||{};let t=0;g.items.forEach(it=>{t+=parseFloat(c[it.key])||0;});return t;}
function renderFeeCard(s){
  const c=s.costs||{};const cur=s.cost_currency||'VND';const total=costTotal(s);
  let stt=0;
  const groupsHtml=COST_GROUPS.map((g,gi)=>{
    const rows=g.items.map(it=>{stt++;const val=c[it.key];
      const cell=editingCosts
        ?`<input type="number" step="any" min="0" id="cost_${it.key}" value="${val!=null&&val!==''?val:''}" placeholder="0" style="width:140px;padding:6px 8px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:13px;text-align:right;">`
        :`<span style="font-weight:${val?'600':'400'};color:${val?'#333':'#bbb'};">${val?fmtMoney(val):'—'}</span>`;
      return`<tr>
        <td style="text-align:center;color:#aaa;font-size:12px;">${stt}</td>
        <td style="font-size:13px;">${it.label}</td>
        <td style="font-size:12px;color:#888;">${it.en}</td>
        <td style="text-align:right;">${cell}</td>
      </tr>`;
    }).join('');
    const gt=groupTotal(s,g);
    return`<tr style="background:#fff3e0;"><td colspan="3" style="font-weight:700;color:#e65100;font-size:12px;padding:8px 14px;">${['I','II','III','IV'][gi]||(gi+1)}. ${g.title}</td><td style="text-align:right;font-weight:700;color:#e65100;padding:8px 14px;">${gt?fmtMoney(gt)+' '+cur:''}</td></tr>${rows}`;
  }).join('');
  const curSel=editingCosts?`<select id="costCurrency" style="padding:5px 8px;border:1.5px solid #e0e0e0;border-radius:6px;font-size:12px;">${COST_CURRENCIES.map(x=>`<option value="${x}" ${x===cur?'selected':''}>${x}</option>`).join('')}</select>`:`<span style="font-size:12px;color:#888;">${cur}</span>`;
  return`<div class="detail-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <div class="section-title" style="margin:0;">💵 Chi phí lô hàng ${curSel}</div>
      ${editingCosts
        ?`<div style="display:flex;gap:8px;"><button class="btn-mini" style="background:#ff7043;color:white;border-color:#ff7043;" onclick="saveCosts()">💾 Lưu</button><button class="btn-mini" style="color:#c0392b;" onclick="editingCosts=false;renderDetail();">Hủy</button></div>`
        :(canEdit()?`<button class="btn-mini" onclick="editingCosts=true;renderDetail();">✏️ Nhập chi phí</button>`:'')}
    </div>
    <table class="ship-table">
      <thead><tr><th style="width:40px;text-align:center;">STT</th><th>Tên loại chi phí</th><th>Viết tắt / English</th><th style="text-align:right;">Số tiền đã chi</th></tr></thead>
      <tbody>${groupsHtml}</tbody>
      <tfoot><tr style="background:#fbe9e7;"><td colspan="3" style="font-weight:700;color:#bf360c;padding:12px 14px;font-size:14px;">TỔNG CHI PHÍ</td><td style="text-align:right;font-weight:700;color:#bf360c;padding:12px 14px;font-size:15px;">${fmtMoney(total)} ${cur}</td></tr></tfoot>
    </table>
  </div>`;
}
async function saveCosts(){
  const costs={};
  COST_GROUPS.forEach(g=>g.items.forEach(it=>{const el=document.getElementById('cost_'+it.key);const v=el?el.value.trim():'';if(v!=='')costs[it.key]=parseFloat(v)||0;}));
  const cost_currency=document.getElementById('costCurrency')?.value||'VND';
  showLoading('Đang lưu chi phí...');
  try{
    const{error}=await sb.from('logistics_shipments').update({costs,cost_currency,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',currentId);
    if(error)throw error;
    currentShip.costs=costs;currentShip.cost_currency=cost_currency;
    const idx=allShips.findIndex(x=>x.id===currentId);if(idx>=0){allShips[idx].costs=costs;allShips[idx].cost_currency=cost_currency;}
    editingCosts=false;renderDetail();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== DOC CHECKLIST =====
async function toggleDoc(key){
  if(!canEdit())return;
  const d={...(currentShip.doc_status||{})};d[key]=!d[key];
  showLoading('Đang lưu...');
  try{const{error}=await sb.from('logistics_shipments').update({doc_status:d,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',currentId);if(error)throw error;
    currentShip.doc_status=d;const idx=allShips.findIndex(x=>x.id===currentId);if(idx>=0)allShips[idx].doc_status=d;renderDetail();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== UPLOAD (Drive) =====
// uploadCtx = {id, mode:'general'|'doc'|'bulk', docKey?}
let uploadCtx=null;
document.getElementById('fileInput').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value='';});
function triggerUpload(id){uploadCtx={id,mode:'general'};document.getElementById('fileInput').click();}       // đính kèm chung
function triggerDocUpload(id,docKey){uploadCtx={id,mode:'doc',docKey};document.getElementById('fileInput').click();} // đính cho 1 mục
function triggerBulkUpload(id){uploadCtx={id,mode:'bulk'};document.getElementById('fileInput').click();}         // hàng loạt theo số
function triggerZipUpload(id){uploadCtx={id,mode:'doc',docKey:'_zip'};document.getElementById('fileInput').click();} // file nén .zip
function downloadDriveFile(fileId){if(!fileId)return;window.open('https://drive.google.com/uc?export=download&id='+fileId,'_blank');}
// Tải nguyên bộ chứng từ: nén tất cả file các mục thành 1 zip
async function downloadAllDocs(){
  const atts=(currentShip.attachments||[]).filter(a=>a.doc&&a.fileId);
  if(!atts.length){alert('Chưa có file chứng từ nào để tải.');return;}
  const files=atts.map(a=>{
    const di=DOC_LIST.findIndex(d=>d.key===a.doc);
    const prefix=di>=0?String(di+1).padStart(2,'0')+' - '+DOC_LIST[di].label+' - ':'';
    return {fileId:a.fileId,name:prefix+(a.title||'file')};
  });
  const zipName=(currentShip.lot_code||'lo-hang')+' - Bo chung tu';
  showLoading('Đang nén bộ chứng từ...');
  try{
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({secret:UPLOAD_SECRET,action:'zip',files,zipName})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Nén thất bại');
    const bin=atob(j.zipBase64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'application/zip'});
    const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=j.zipName;link.click();URL.revokeObjectURL(url);
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}
async function handleFiles(files){
  if(!uploadCtx||!currentShip)return;
  const newDocStatus={...(currentShip.doc_status||{})};
  const warn=[];
  for(const file of [...files]){
    if(file.size>MAX_FILE){alert(`File "${file.name}" quá 20MB, bỏ qua.`);continue;}
    // Xác định mục chứng từ cho file này
    let docKey=null;
    if(uploadCtx.mode==='doc'){docKey=uploadCtx.docKey;}
    else if(uploadCtx.mode==='bulk'){
      const m=(file.name||'').match(/^\s*0*(\d+)/);   // số đứng đầu tên file
      const n=m?parseInt(m[1]):0;
      if(n>=1&&n<=DOC_LIST.length){docKey=DOC_LIST[n-1].key;}
      else{warn.push(file.name);}                      // không có số hợp lệ → đính kèm chung
    }
    showLoading(`Đang tải lên Drive: ${file.name}...`);
    try{
      const r=await driveUpload(currentShip.id,currentShip.lot_code||'',file);
      const docItem={title:r.name||file.name,url:r.url,previewUrl:r.previewUrl,fileId:r.fileId,mime:file.type,size:r.size||file.size,user:currentUser.name,time:Date.now(),doc:docKey};
      const list=[...(currentShip.attachments||[]),docItem];
      await sb.from('logistics_shipments').update({attachments:list}).eq('id',currentShip.id);
      currentShip.attachments=list;
      if(docKey&&DOC_LIST.some(d=>d.key===docKey))newDocStatus[docKey]=true; // chỉ auto-tick mục chứng từ thật (bỏ qua _zip)
    }catch(e){alert(`Lỗi tải "${file.name}": ${e.message}`);}
  }
  // cập nhật tick nếu có thay đổi
  if(JSON.stringify(newDocStatus)!==JSON.stringify(currentShip.doc_status||{})){
    currentShip.doc_status=newDocStatus;
    await sb.from('logistics_shipments').update({doc_status:newDocStatus,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',currentShip.id);
  }
  const idx=allShips.findIndex(x=>x.id===currentShip.id);if(idx>=0){allShips[idx].attachments=currentShip.attachments;allShips[idx].doc_status=currentShip.doc_status;}
  hideLoading();renderDetail();
  if(warn.length)alert(`${warn.length} file không có số đầu hợp lệ (1–${DOC_LIST.length}) → đã đưa vào "File đính kèm chung":\n\n`+warn.join('\n'));
}
async function removeAtt(i){
  const a=(currentShip.attachments||[])[i];if(!a)return;
  if(!confirm(`Xóa "${a.title}"?`))return;
  showLoading('Đang xóa...');
  try{if(a.fileId)await driveDelete(a.fileId);
    const list=[...currentShip.attachments];list.splice(i,1);
    await sb.from('logistics_shipments').update({attachments:list,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',currentShip.id);
    currentShip.attachments=list;const idx=allShips.findIndex(x=>x.id===currentShip.id);if(idx>=0)allShips[idx].attachments=list;renderDetail();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}
function previewDoc(previewUrl,openUrl){if(!previewUrl){if(openUrl)window.open(openUrl,'_blank');return;}document.getElementById('previewContent').innerHTML=`<iframe src="${esc(previewUrl)}"></iframe>`;document.getElementById('previewBackdrop').classList.remove('hidden');}
function closePreview(){document.getElementById('previewBackdrop').classList.add('hidden');document.getElementById('previewContent').innerHTML='';}

// ===== MODAL =====
function closeModal(){document.getElementById('shipModal').classList.add('hidden');}
function openModal(id){
  document.getElementById('modalError').style.display='none';
  if(id){const s=allShips.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Sửa · '+s.lot_code;document.getElementById('editId').value=id;
    document.getElementById('fLot').value=s.lot_code||'';document.getElementById('fContract').value=s.contract_code||'';document.getElementById('fType').value=s.coffee_type||'robusta_r2';
    document.getElementById('fQty').value=s.quantity||'';document.getElementById('fStatus').value=s.status||'booking';document.getElementById('fCustomer').value=s.customer||'';
    document.getElementById('fSupplier').value=s.supplier||'';document.getElementById('fBooking').value=s.booking_no||'';document.getElementById('fVessel').value=s.vessel||'';
    document.getElementById('fContainer').value=s.container_no||'';document.getElementById('fEtd').value=s.etd||'';document.getElementById('fEta').value=s.eta||'';
    document.getElementById('fPortLoad').value=s.port_load||'';document.getElementById('fPortDisch').value=s.port_disch||'';document.getElementById('fNotes').value=s.notes||'';
    document.getElementById('saveBtn').textContent='Cập nhật';
  }else{document.getElementById('modalTitle').textContent='Thêm lô hàng';document.getElementById('editId').value='';
    ['fLot','fContract','fQty','fCustomer','fSupplier','fBooking','fVessel','fContainer','fEtd','fEta','fPortLoad','fPortDisch','fNotes'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('fType').value='robusta_r2';document.getElementById('fStatus').value='booking';document.getElementById('saveBtn').textContent='Lưu';}
  document.getElementById('shipModal').classList.remove('hidden');
}
async function saveShip(){
  const err=document.getElementById('modalError');err.style.display='none';
  const lot=document.getElementById('fLot').value.trim();
  if(!lot){err.textContent='Vui lòng nhập mã lô';err.style.display='block';return;}
  const payload={lot_code:lot,contract_code:document.getElementById('fContract').value.trim()||null,coffee_type:document.getElementById('fType').value,
    quantity:document.getElementById('fQty').value.trim()||null,status:document.getElementById('fStatus').value,customer:document.getElementById('fCustomer').value.trim()||null,
    supplier:document.getElementById('fSupplier').value.trim()||null,booking_no:document.getElementById('fBooking').value.trim()||null,vessel:document.getElementById('fVessel').value.trim()||null,
    container_no:document.getElementById('fContainer').value.trim()||null,etd:document.getElementById('fEtd').value||null,eta:document.getElementById('fEta').value||null,
    port_load:document.getElementById('fPortLoad').value.trim()||null,port_disch:document.getElementById('fPortDisch').value.trim()||null,notes:document.getElementById('fNotes').value.trim()||null,
    updated_by:currentUser.name,updated_at:new Date().toISOString()};
  const id=document.getElementById('editId').value;const btn=document.getElementById('saveBtn');btn.disabled=true;showLoading(id?'Đang cập nhật...':'Đang lưu...');
  try{
    if(id){await sb.from('logistics_shipments').update(payload).eq('id',id);}
    else{payload.id='ls_'+Date.now()+'_'+Math.floor(Math.random()*9999);payload.created_by=currentUser.name;payload.created_at=new Date().toISOString();payload.doc_status={};payload.attachments=[];payload.costs={};payload.cost_currency='VND';await sb.from('logistics_shipments').insert(payload);}
    closeModal();await loadData();
    if(id){currentShip=allShips.find(x=>x.id===id);if(!document.getElementById('viewDetail').classList.contains('hidden'))renderDetail();}
  }catch(e){err.textContent='Lỗi: '+e.message;err.style.display='block';}finally{btn.disabled=false;hideLoading();}
}
async function deleteShip(id){
  if(!isAdmin()){alert('Chỉ Admin được xóa');return;}
  const s=allShips.find(x=>x.id===id);if(!confirm(`Xóa lô "${s?.lot_code}" và toàn bộ file?`))return;
  showLoading('Đang xóa...');
  try{for(const a of (s.attachments||[]))if(a.fileId)await driveDelete(a.fileId);
    await sb.from('logistics_shipments').delete().eq('id',id);showList();await loadData();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== INIT =====
(async function init(){
  showLoading('Đang khởi động...');
  try{const{data:{session}}=await sb.auth.getSession();if(session?.user)await loadCurrentUser(session.user);}
  catch(e){console.error(e);}finally{hideLoading();}
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user&&!currentUser){await loadCurrentUser(session.user);}
    if(event==='SIGNED_OUT'){currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
  });
})();
</script>

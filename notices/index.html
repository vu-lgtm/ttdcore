<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo nội bộ — TTDCore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
.container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 30px; }
.hidden { display: none !important; }

.login-box { max-width: 480px; margin: 40px auto; text-align: center; }
.login-box h1 { font-size: 28px; margin-bottom: 8px; color: #333; }
.login-box p { color: #666; margin-bottom: 28px; font-size: 14px; }

.top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1px solid #eee; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.top-bar h1 { font-size: 22px; color: #333; }
.top-bar p { color: #888; font-size: 13px; margin-top: 2px; }
.user-info { display: flex; align-items: center; gap: 12px; }
.user-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }

.btn { padding: 9px 18px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.2s; color: #555; }
.btn:hover { border-color: #667eea; color: #667eea; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border-color: transparent; color: white; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); color: white; }
.btn-danger { color: #c0392b; border-color: #f8d7da; }
.btn-danger:hover { border-color: #c0392b; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; background: white; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }

.toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }

/* Notice cards */
.notice-list { display: flex; flex-direction: column; gap: 12px; }
.notice-card { border: 2px solid #eee; border-radius: 10px; padding: 20px; transition: all 0.2s; position: relative; }
.notice-card:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102,126,234,0.08); }
.notice-card.pinned { border-color: #ffc107; background: #fffdf5; }
.notice-card.pinned::before { content: "📌"; position: absolute; top: -10px; right: 16px; font-size: 18px; }
.notice-card.type-urgent { border-left: 4px solid #ef5350; }
.notice-card.type-general { border-left: 4px solid #667eea; }
.notice-card.type-info { border-left: 4px solid #4fc3f7; }
.notice-card.type-event { border-left: 4px solid #ab47bc; }

.notice-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.notice-title { font-size: 16px; font-weight: 700; color: #333; flex: 1; }
.notice-actions { display: flex; gap: 6px; flex-shrink: 0; }

.notice-content { font-size: 14px; color: #555; line-height: 1.7; white-space: pre-wrap; margin-bottom: 12px; }

.notice-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #999; }
.notice-tag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.tag-urgent { background: #ffeaea; color: #c0392b; }
.tag-general { background: #eef0fc; color: #667eea; }
.tag-info { background: #e1f5fe; color: #0277bd; }
.tag-event { background: #f3e5f5; color: #7b1fa2; }

.pin-badge { font-size: 11px; background: #fff8e1; color: #f57f17; padding: 3px 8px; border-radius: 4px; font-weight: 600; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: white; border-radius: 12px; padding: 28px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 20px; margin-bottom: 18px; color: #333; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #666; }
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state .ico { font-size: 48px; margin-bottom: 12px; }

@media (max-width: 768px) { .container { padding: 16px; } }
</style>
</head>
<body>
<div class="loading-overlay hidden" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loadingText">Đang tải...</div></div>

<!-- LOGIN -->
<div class="container" id="loginScreen">
  <div class="login-box">
    <h1>📢 Thông báo nội bộ</h1>
    <p>Thông báo & quy định nội bộ công ty</p>
    <div id="loginError" style="color:#c0392b;font-size:13px;margin-bottom:16px;display:none;"></div>
    <button class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;" onclick="loginWithGoogle()" id="loginBtn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.5 36.2 44 30.5 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Đăng nhập với Google
    </button>
    <p style="margin-top:16px;font-size:12px;color:#aaa;">Chỉ tài khoản <strong>@ttdglobal.vn</strong></p>
  </div>
</div>

<!-- MAIN -->
<div class="container hidden" id="mainApp">
  <div class="top-bar">
    <div>
      <h1>📢 Thông báo nội bộ</h1>
      <p>Thông báo & quy định chung cho toàn công ty</p>
    </div>
    <div class="user-info">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <div class="toolbar">
    <select style="padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;background:white;" id="filterType" onchange="renderNotices()">
      <option value="all">Tất cả</option>
      <option value="urgent">🚨 Khẩn</option>
      <option value="general">📢 Chung</option>
      <option value="info">ℹ️ Thông tin</option>
      <option value="event">📅 Sự kiện</option>
    </select>
    <div style="flex:1;"></div>
    <button class="btn btn-primary hidden" onclick="openModal()" id="btnAdd">+ Đăng thông báo</button>
    <button class="btn" onclick="loadNotices()" title="Tải lại">🔄</button>
  </div>

  <div class="notice-list" id="noticeList"></div>
</div>

<!-- MODAL -->
<div class="modal-backdrop hidden" id="noticeModal">
  <div class="modal">
    <h2 id="modalTitle">Đăng thông báo mới</h2>
    <input type="hidden" id="editId">
    <div class="form-group"><label>Tiêu đề *</label><input type="text" id="fTitle" placeholder="Tiêu đề thông báo"></div>
    <div class="form-group"><label>Nội dung *</label><textarea id="fContent" rows="8" placeholder="Nội dung chi tiết..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label>Loại</label>
        <select id="fType">
          <option value="general">📢 Chung</option>
          <option value="urgent">🚨 Khẩn</option>
          <option value="info">ℹ️ Thông tin</option>
          <option value="event">📅 Sự kiện</option>
        </select>
      </div>
      <div class="form-group"><label>Ghim lên đầu</label>
        <select id="fPinned">
          <option value="false">Không</option>
          <option value="true">📌 Ghim</option>
        </select>
      </div>
    </div>
    <div id="modalError" style="color:#c0392b;font-size:13px;display:none;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" onclick="saveNotice()" id="saveBtn">Đăng</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://fyjinbtabsentsvnkqzg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5amluYnRhYnNlbnRzdm5rcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTAxNTUsImV4cCI6MjA5NDI4NjE1NX0.m1H8bOT7gUXJxPoQT6bDqtRUjo4nCSxb4A1rth7Eols';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const GRACE_EMAIL='grace@ttdglobal.vn';
const SUPER_ADMIN='vu@ttdglobal.vn';
const DEPTS={sale:'Sale',ketoan:'Kế toán',thumua:'Thu mua',logistics:'Logistics',admin:'Ban Giám Đốc',sale_admin:'Sale Admin'};
const TYPE_CFG={
  urgent:{icon:'🚨',label:'Khẩn',tagClass:'tag-urgent'},
  general:{icon:'📢',label:'Chung',tagClass:'tag-general'},
  info:{icon:'ℹ️',label:'Thông tin',tagClass:'tag-info'},
  event:{icon:'📅',label:'Sự kiện',tagClass:'tag-event'}
};
// Ai được đăng/sửa/xóa thông báo
const POSTER_ROLES=['admin','sale_admin'];

let currentUser=null, allNotices=[];

function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showLoading(t='Đang tải...'){document.getElementById('loadingText').textContent=t;document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function isAdmin(){return currentUser&&(currentUser.role==='admin'||currentUser.email===GRACE_EMAIL);}
function canPost(){return currentUser&&(isAdmin()||POSTER_ROLES.includes(currentUser.role)||currentUser.email===SUPER_ADMIN);}

// ─── AUTH ───
async function loginWithGoogle(){
  const errEl=document.getElementById('loginError'),btn=document.getElementById('loginBtn');
  errEl.style.display='none';btn.disabled=true;showLoading('Đang chuyển hướng...');
  try{
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href,queryParams:{hd:'ttdglobal.vn'}}});
    if(error)throw error;
  }catch(e){errEl.textContent='Lỗi: '+e.message;errEl.style.display='block';btn.disabled=false;hideLoading();}
}
async function loadCurrentUser(authUser){
  let profile=null;
  const{data:byId}=await sb.from('profiles').select('*').eq('id',authUser.id).single();
  if(byId){profile=byId;}
  else{
    const{data:byEmail}=await sb.from('profiles').select('*').eq('email',authUser.email).maybeSingle();
    if(byEmail){await sb.from('profiles').update({id:authUser.id}).eq('email',authUser.email);profile=byEmail;}
  }
  if(!profile){await sb.auth.signOut();alert('Tài khoản chưa được cấu hình.');return;}
  currentUser={id:authUser.id,email:authUser.email,name:profile.name,role:profile.role};
  showMainApp();
}
async function logout(){await sb.auth.signOut();currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
function showMainApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  const roleLabel=isAdmin()?'👑 Admin':DEPTS[currentUser.role]||currentUser.role;
  document.getElementById('userBadge').textContent=`${currentUser.name} · ${roleLabel}`;
  if(canPost())document.getElementById('btnAdd').classList.remove('hidden');
  loadNotices();
}

// ─── DATA ───
async function loadNotices(){
  showLoading('Đang tải...');
  try{
    const{data,error}=await sb.from('notices').select('*').order('created_at',{ascending:false});
    if(error)throw error;
    allNotices=data||[];renderNotices();
  }catch(e){
    document.getElementById('noticeList').innerHTML=`<div class="empty-state"><p>Lỗi: ${e.message}</p></div>`;
  }finally{hideLoading();}
}

function renderNotices(){
  const list=document.getElementById('noticeList');
  const fType=document.getElementById('filterType').value;

  let filtered=allNotices.filter(n=>fType==='all'||n.type===fType);

  // Pinned lên đầu
  filtered.sort((a,b)=>{
    if(a.pinned&&!b.pinned)return -1;
    if(!a.pinned&&b.pinned)return 1;
    return new Date(b.created_at)-new Date(a.created_at);
  });

  if(!filtered.length){
    list.innerHTML='<div class="empty-state"><div class="ico">📭</div><p>Chưa có thông báo nào</p></div>';
    return;
  }

  list.innerHTML=filtered.map(n=>{
    const cfg=TYPE_CFG[n.type]||TYPE_CFG.general;
    const date=n.created_at?new Date(n.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    const isOwner=currentUser&&(n.author_email===currentUser.email);
    const canEdit=canPost()&&(isAdmin()||isOwner);

    return`<div class="notice-card ${n.pinned?'pinned':''} type-${n.type||'general'}">
      <div class="notice-header">
        <div class="notice-title">${cfg.icon} ${esc(n.title)}</div>
        ${canEdit?`<div class="notice-actions">
          <button class="btn" style="padding:5px 10px;font-size:12px;" onclick="openEditModal('${n.id}')">✏️</button>
          ${isAdmin()?`<button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="deleteNotice('${n.id}')">🗑️</button>`:''}
        </div>`:''}
      </div>
      <div class="notice-content">${esc(n.content||'')}</div>
      <div class="notice-meta">
        <span class="notice-tag ${cfg.tagClass}">${cfg.label}</span>
        ${n.pinned?'<span class="pin-badge">📌 Ghim</span>':''}
        <span>👤 ${esc(n.author||'Admin')}</span>
        <span>🕐 ${date}</span>
      </div>
    </div>`;
  }).join('');
}

// ─── MODAL ───
function closeModal(){document.getElementById('noticeModal').classList.add('hidden');}

function openModal(){
  if(!canPost()){alert('Bạn không có quyền đăng thông báo');return;}
  document.getElementById('modalTitle').textContent='Đăng thông báo mới';
  document.getElementById('editId').value='';
  document.getElementById('fTitle').value='';
  document.getElementById('fContent').value='';
  document.getElementById('fType').value='general';
  document.getElementById('fPinned').value='false';
  document.getElementById('modalError').style.display='none';
  document.getElementById('saveBtn').textContent='Đăng';
  document.getElementById('noticeModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('fTitle').focus(),50);
}

function openEditModal(id){
  const n=allNotices.find(x=>x.id===id);if(!n)return;
  document.getElementById('modalTitle').textContent='Sửa thông báo';
  document.getElementById('editId').value=id;
  document.getElementById('fTitle').value=n.title||'';
  document.getElementById('fContent').value=n.content||'';
  document.getElementById('fType').value=n.type||'general';
  document.getElementById('fPinned').value=n.pinned?'true':'false';
  document.getElementById('modalError').style.display='none';
  document.getElementById('saveBtn').textContent='Cập nhật';
  document.getElementById('noticeModal').classList.remove('hidden');
}

async function saveNotice(){
  const errEl=document.getElementById('modalError');errEl.style.display='none';
  const title=document.getElementById('fTitle').value.trim();
  const content=document.getElementById('fContent').value.trim();
  if(!title||!content){errEl.textContent='Vui lòng nhập tiêu đề và nội dung';errEl.style.display='block';return;}

  const payload={
    title,content,
    type:document.getElementById('fType').value,
    pinned:document.getElementById('fPinned').value==='true',
    author:currentUser.name,
    author_email:currentUser.email
  };

  const editId=document.getElementById('editId').value;
  const btn=document.getElementById('saveBtn');btn.disabled=true;
  showLoading(editId?'Đang cập nhật...':'Đang đăng...');

  try{
    if(editId){
      const{error}=await sb.from('notices').update(payload).eq('id',editId);
      if(error)throw error;
    }else{
      payload.id='ntc_'+Date.now()+'_'+Math.floor(Math.random()*999);
      payload.created_at=new Date().toISOString();
      const{error}=await sb.from('notices').insert(payload);
      if(error)throw error;
    }
    closeModal();await loadNotices();
  }catch(e){errEl.textContent='Lỗi: '+e.message;errEl.style.display='block';}
  finally{btn.disabled=false;hideLoading();}
}

async function deleteNotice(id){
  if(!isAdmin()){alert('Chỉ Admin được xóa');return;}
  if(!confirm('Xóa thông báo này?'))return;
  showLoading('Đang xóa...');
  try{
    const{error}=await sb.from('notices').delete().eq('id',id);
    if(error)throw error;
    await loadNotices();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ─── INIT ───
(async function init(){
  showLoading('Đang khởi động...');
  try{const{data:{session}}=await sb.auth.getSession();if(session?.user)await loadCurrentUser(session.user);}
  catch(e){console.error(e);}finally{hideLoading();}
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user&&!currentUser){await loadCurrentUser(session.user);}
    if(event==='SIGNED_OUT'){currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Đề nghị thanh toán · TTDCore</title>
<link rel="manifest" href="/thanh-toan/manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thanh toán">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f2f4f6;--panel:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e5e7eb;--brand:#0f766e;--brand2:#115e4a;--brand-bg:#f0fdfa;--ok:#16a34a;--ok-bg:#e8f6ec;--warn:#d97706;--warn-bg:#fef3e2;--err:#dc2626;--err-bg:#fdecec;--grey-bg:#f1f3f5;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 15px;border-radius:12px;cursor:pointer}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.danger{color:#fff;background:var(--err);border-color:var(--err);font-weight:700}
button.dangerline{color:var(--err);border-color:#f3c4c4;background:#fff}
button.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
input,textarea,select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid #99e0d6;border-color:var(--brand)}

.demobar{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:12.5px;padding:7px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demobar select{width:auto;font-size:13px;padding:5px 8px;border-radius:8px}

header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:calc(10px + var(--safe-t)) 16px 11px;display:flex;align-items:center;gap:10px}
header .home{color:#fff;text-decoration:none;font-size:20px;line-height:1;opacity:.9}
header h1{font-size:17px;margin:0;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:12px;opacity:.9;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .lo{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:7px 11px;font-size:13px}

.toolbar{position:sticky;top:var(--hh,0px);z-index:15;background:var(--bg);padding:12px 14px 6px}
.searchrow{display:flex;gap:8px}
.searchrow .newbtn{display:none;white-space:nowrap}
.tabrow{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:#555;font-weight:700;font-size:13.5px;white-space:nowrap}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.tab .c{opacity:.85;font-weight:600;margin-left:2px}
.tab .c.hot{background:var(--err);color:#fff;border-radius:999px;padding:0 6px;opacity:1}

.list{display:flex;flex-direction:column;gap:9px;padding:4px 14px calc(96px + var(--safe-b))}
.req{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer}
.req:active{background:#f7faf9}
.req.sel{border-color:var(--brand);box-shadow:0 0 0 2px #99e0d6 inset}
.req.st-pending{border-left-color:var(--warn)}.req.st-approved{border-left-color:var(--ok)}.req.st-rejected{border-left-color:var(--err)}.req.st-cancelled{border-left-color:#9ca3af}
.req .r1{display:flex;gap:8px;align-items:flex-start}
.req .ttl{font-weight:800;font-size:15px;line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.req .amt{font-weight:800;white-space:nowrap;color:#0b3d36}
.req .meta{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req .r3{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.req .r3 .sp{flex:1}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-pending{background:var(--warn-bg);color:var(--warn)}.p-approved{background:var(--ok-bg);color:var(--ok)}.p-rejected{background:var(--err-bg);color:var(--err)}.p-cancelled{background:var(--grey-bg);color:#6b7280}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--grey-bg);color:#4b5563}
.tag.turn{background:#fff7ed;color:#c2410c}.tag.me{background:#fee2e2;color:#b91c1c}.tag.print{background:#e0f2fe;color:#0369a1}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:30;background:var(--brand);color:#fff;border:none;border-radius:999px;height:54px;padding:0 20px;font-size:15.5px;font-weight:800;box-shadow:0 10px 24px rgba(15,118,110,.4)}

/* ---------- DETAIL ---------- */
.detail{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column}
.detail.on{display:flex}
.dt-hd{padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dt-hd .back{border:none;background:var(--grey-bg);border-radius:10px;padding:7px 12px;font-weight:700}
.dt-hd .code{font-size:12.5px;color:var(--muted);font-weight:700}
.dt-body{flex:1;overflow:auto;padding:16px 16px 24px}
.dt-ft{padding:10px 14px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.dt-ft button{flex:1;padding:13px;min-width:120px}
.dt-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-direction:column;gap:8px}
.dt-title{font-size:19px;font-weight:800;line-height:1.35;margin:0 0 6px}
.dt-sub{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.dt-sub .over{color:var(--err);font-weight:700}
.dt-grid{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.dt-side{display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.sec-t{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-t .r{margin-left:auto;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-word}
.frow{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:none}
.frow .n{color:#9ca3af;font-size:12px;width:20px;flex:0 0 auto;padding-top:2px}
.frow .l{font-size:12.5px;color:var(--muted)}
.frow .val{font-size:14.5px;margin-top:2px;word-break:break-word;white-space:pre-wrap}
.frow .words{font-style:italic;color:#374151;font-size:13.5px;margin-top:2px}
.bigamt{font-size:18px;font-weight:800;color:#0b3d36}
.tblwrap{overflow-x:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px}
table.items{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.items th{background:#f8fafc;color:#475569;font-size:11.5px;text-transform:uppercase;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.items td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.items td.num,table.items th.num{text-align:right;white-space:nowrap}
table.items tr.tot td{font-weight:800;background:#f8fafc;border-bottom:none}

.apv{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.apv:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:0 0 auto}
.apv .who{flex:1;min-width:0}
.apv .nm{font-weight:700;font-size:14px}
.apv .ti{font-size:12px;color:var(--muted)}
.apv .nt{font-size:12.5px;margin-top:3px;color:#374151;background:var(--grey-bg);border-radius:8px;padding:5px 8px}
.apv .nt.bad{background:var(--err-bg);color:#991b1b}
.ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:0 0 auto;margin-top:5px}
.ic.approved{background:var(--ok);color:#fff}.ic.pending{background:var(--warn);color:#fff}.ic.waiting{background:#e5e7eb;color:#9ca3af}.ic.rejected{background:var(--err);color:#fff}
.apv.cur{background:#fffbeb;margin:0 -8px;padding:9px 8px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--grey-bg);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.chip .av{width:22px;height:22px;font-size:11px}

.files{display:grid;grid-template-columns:1fr;gap:8px}
.file{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-decoration:none;color:inherit}
.file .fi{width:36px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:#fff;flex:0 0 auto}
.file .fn{font-weight:700;font-size:13.5px;word-break:break-all}
.file .fm{font-size:12px;color:var(--muted)}
.file .fx{margin-left:auto;border:none;background:none;color:#9ca3af;font-size:16px;padding:6px}

.tl{position:relative;padding-left:4px}
.tli{display:flex;gap:10px;padding:6px 0;position:relative}
.tli .dot{width:22px;height:22px;border-radius:50%;background:var(--brand-bg);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;border:1px solid #99e0d6}
.tli .tx{font-size:13px}
.tli .tm{font-size:11.5px;color:var(--muted)}
.cm{display:flex;gap:9px;padding:8px 0}
.cm .bub{background:var(--grey-bg);border-radius:12px;padding:8px 11px;font-size:14px;flex:1;white-space:pre-wrap;word-break:break-word}
.cm .bub b{font-size:13px}
.cm .bub .tm{font-size:11.5px;color:var(--muted);margin-left:6px;font-weight:400}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform textarea{min-height:44px}

/* ---------- FORM SHEET / DIALOG ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none}
.sheet.on{display:block}
.sheet .panel{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.sheet .hd{padding:calc(12px + var(--safe-t)) 16px 12px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.sheet .hd .x{margin-left:auto;background:var(--grey-bg);border:none;border-radius:10px;padding:7px 12px}
.sheet .bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet .ft{padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .ft button{flex:1;padding:14px}
label.fl{font-size:13px;font-weight:700;color:#374151;display:block;margin-bottom:6px}
.req-star{color:var(--err)}
.g2{display:grid;grid-template-columns:1fr;gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.box-t{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.6px}
.itemrow{border:1px solid var(--line);border-radius:11px;padding:10px;position:relative;background:#fcfcfd}
.itemrow .no{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.ir-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ir-grid .full{grid-column:1/-1}
.ir-grid label{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.ir-grid input{font-size:16px;padding:9px 10px}
.itemrow .ir-x{position:absolute;top:6px;right:6px;border:none;background:none;color:#9ca3af;font-size:16px;padding:4px 8px}
.totalbox{background:var(--brand-bg);border:1px solid #99e0d6;border-radius:12px;padding:12px 14px}
.totalbox .tb-l{font-size:12.5px;color:var(--brand);font-weight:800}
.totalbox .tb-n{font-size:22px;font-weight:900;color:#0b3d36;margin-top:2px}
.totalbox .tb-w{font-style:italic;font-size:13.5px;color:#374151;margin-top:2px}
.apflow{display:grid;grid-template-columns:1fr;gap:8px}
.apstep{display:flex;gap:10px;align-items:center}
.apno{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.apt{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.apstep select{padding:9px 10px}
.apfix{font-weight:700;padding:9px 12px;background:var(--grey-bg);border-radius:11px}
@media(min-width:620px){.apflow{grid-template-columns:repeat(4,1fr)}}
.fpend{display:flex;flex-direction:column;gap:6px}
.fpend .file{padding:7px 9px}
.flw{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:8px}
.flw label{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.flw input{width:20px;height:20px}
.warnbox{background:var(--warn-bg);color:#92400e;border:1px solid #fcd9a6;border-radius:10px;padding:10px 12px;font-size:13.5px}
.errline{color:var(--err);font-size:14px;display:none}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.dlg .box2{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:17px}
.dlg .btns{display:flex;gap:10px}
.dlg .btns button{flex:1;padding:13px}

#login{max-width:420px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:99;font-size:14px;max-width:92vw;text-align:center}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;align-items:center;justify-content:center;z-index:120;font-weight:700;color:var(--brand);text-align:center;padding:20px}
#printArea{display:none}

/* ---------- DESKTOP ---------- */
@media(min-width:620px){
  .sheet .panel{max-width:820px;margin:auto;inset:3vh 0;border-radius:16px;overflow:hidden}
  .g2{grid-template-columns:1fr 1fr}
  .ir-grid{grid-template-columns:2.2fr 1.2fr 1.2fr 1fr 1fr 1.4fr}
  .ir-grid .full{grid-column:auto}
  .dlg{align-items:center}
  .dlg .box2{border-radius:16px}
  .files{grid-template-columns:1fr 1fr}
}
@media(min-width:1000px){
  body.app-on{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  #app{display:flex;flex-direction:column;flex:1;min-height:0}
  .split{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
  .leftcol{overflow:auto;border-right:1px solid var(--line);background:var(--bg)}
  .toolbar{top:0}
  .list{padding-bottom:24px}
  .searchrow .newbtn{display:block}
  .fab{display:none}
  .detail{position:static;display:flex;min-height:0;z-index:auto}
  .dt-hd .back{display:none}
  .dt-body{padding:20px 26px 30px}
  .dt-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .dt-ft{justify-content:flex-end}
  .dt-ft button{flex:0 0 auto;min-width:130px}
}
@media(max-width:999px){.dt-side{display:contents}.dt-side>*{order:1}.dt-side .apvcard{order:-1}}

/* ---------- PRINT ---------- */
@media print{
  @page{size:A4;margin:11mm 12mm}
  body{background:#fff!important;height:auto!important;overflow:visible!important;display:block!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.pv{font-family:"Times New Roman",Times,serif;color:#000;font-size:12.5px;line-height:1.38}
.pv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:6px}
.pv-head .co b{font-size:14px}
.pv-head .cd{text-align:right}
.pv h1{text-align:center;font-size:20px;margin:14px 0 0;letter-spacing:.5px}
.pv .sub{text-align:center;font-style:italic;margin-bottom:12px}
.pv table{border-collapse:collapse;width:100%}
.pv .info td{padding:3px 4px;vertical-align:top}
.pv .info td.k{width:31%;color:#222}
.pv .grid th,.pv .grid td{border:1px solid #000;padding:4px 5px;vertical-align:top}
.pv .grid th{background:#eee;font-size:11.5px}
.pv .num{text-align:right;white-space:nowrap}
.pv h3{font-size:13px;margin:12px 0 5px;text-transform:uppercase}
.pv .signs{display:grid;gap:6px;margin-top:12px;text-align:center}
.pv .signs .s{border:1px solid #000;padding:6px 4px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.pv .signs .r{font-weight:bold;font-size:11.5px;text-transform:uppercase}
.pv .stamp{border:2px solid #0f766e;color:#0f766e;border-radius:6px;padding:3px 4px;font-weight:bold;font-size:10.5px;margin:6px auto;display:inline-block}
.pv .stamp.no{border-color:#999;color:#999}
.pv .foot{margin-top:12px;border-top:1px solid #000;padding-top:4px;font-size:10.5px;color:#333;display:flex;justify-content:space-between;gap:10px}
</style>
</head>
<body>

<div id="login">
  <h2 style="margin-top:0;color:var(--brand)">💳 Đề nghị thanh toán</h2>
  <p style="color:var(--muted);font-size:14px">Đăng nhập Google @ttdglobal.vn</p>
  <button class="primary" id="btnLogin" style="width:100%;padding:15px">Đăng nhập với Google</button>
  <div id="loginErr" style="color:var(--err);font-size:13px;margin-top:10px;display:none"></div>
</div>

<div id="app" hidden>
  <div class="demobar" id="demobar" hidden>⚠️ BẢN DEMO — dữ liệu mẫu, không lưu. Xem với tư cách:
    <select id="demoUser" onchange="demoSwitch(this.value)"></select>
  </div>
  <header>
    <a class="home" href="/" title="Trang chủ TTDCore">⌂</a>
    <h1>💳 Đề nghị thanh toán</h1>
    <span class="who" id="who"></span>
    <button class="lo" id="btnLogout">Thoát</button>
  </header>
  <div class="split">
    <div class="leftcol">
      <div class="toolbar">
        <div class="searchrow">
          <input id="search" placeholder="🔍 Tìm tiêu đề, mã, lô, người tạo…" oninput="renderList()">
          <button class="primary newbtn" onclick="openForm('new')">＋ Đề nghị mới</button>
        </div>
        <div class="tabrow" id="tabs"></div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <section class="detail" id="detail">
      <div class="dt-empty" id="dtEmpty"><div style="font-size:40px">💳</div><div>Chọn 1 đề nghị để xem chi tiết</div></div>
      <div class="dt-hd" id="dtHd" hidden></div>
      <div class="dt-body" id="dtBody" hidden></div>
      <div class="dt-ft" id="dtFt" hidden></div>
    </section>
  </div>

function fmtDate(d){if(!d)return'';const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[3]}/${m[2]}/${m[1]}`;const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('vi-VN');}
function fmtDT(t){if(!t)return'';const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())} ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;}
function relTime(t){if(!t)return'';const s=(Date.now()-new Date(t))/1000;if(s<60)return'vừa xong';if(s<3600)return Math.floor(s/60)+' phút trước';if(s<86400)return Math.floor(s/3600)+' giờ trước';const d=Math.floor(s/86400);return d<30?d+' ngày trước':fmtDate(t);}

function fmtMoney(n,cur){n=Number(n)||0;if(cur==='USD')return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return Math.round(n).toLocaleString('vi-VN');}
function parseMoney(s,cur){s=String(s==null?'':s);if(cur==='USD'){const v=parseFloat(s.replace(/,/g,''));return isNaN(v)?0:Math.round(v*100)/100;}const v=parseInt(s.replace(/[^\d]/g,''),10);return isNaN(v)?0:v;}
const CS=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function read3(n,full){
  const tr=Math.floor(n/100),ch=Math.floor(n%100/10),dv=n%10,o=[];
  if(tr>0||full)o.push(CS[tr]+' trăm');
  if(ch>1){o.push(CS[ch]+' mươi');if(dv===1)o.push('mốt');else if(dv===5)o.push('lăm');else if(dv>0)o.push(CS[dv]);}
  else if(ch===1){o.push('mười');if(dv===5)o.push('lăm');else if(dv>0)o.push(CS[dv]);}
  else if(dv>0){if(tr>0||full)o.push('linh');o.push(CS[dv]);}
  return o.join(' ');
}
function vnWords(num){
  num=Math.floor(Math.abs(Number(num)||0));if(num===0)return'không';
  const units=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'],g=[];
  while(num>0){g.push(num%1000);num=Math.floor(num/1000);}
  const parts=[];
  for(let i=g.length-1;i>=0;i--){if(g[i]===0)continue;parts.push(read3(g[i],i<g.length-1)+(units[i]?' '+units[i]:''));}
  return parts.join(' ');
}
function moneyWords(n,cur){
  n=Number(n)||0;const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  if(cur==='USD'){const d=Math.floor(n),c=Math.round((n-d)*100);return cap(vnWords(d))+' đô la Mỹ'+(c?' và '+vnWords(c)+' cent':'');}
  return cap(vnWords(n))+' đồng';
}

// Đọc bản mới nhất → áp thay đổi → ghi có khóa lạc quan (tránh 2 người ghi đè nhau)
async function mutate(id,fn){
  for(let i=0;i<4;i++){
    const fresh=await DB.get(id);
    const patch=fn(JSON.parse(JSON.stringify(fresh)));
    if(!patch)return fresh;
    patch.updated_at=nowISO();
    if(await DB.update(id,patch,fresh.updated_at))return Object.assign(fresh,patch);
  }
  throw new Error('Dữ liệu vừa được người khác cập nhật — tải lại và thử lần nữa.');
}

      ${avatar(a.name,a.email)}

/* ============================ HÀNH ĐỘNG ============================ */
function hist(r,action,note){(r.history=r.history||[]).push({at:nowISO(),by:currentUser.name,email:me(),action,note:note||''});}
// Chuyển sang người duyệt kế tiếp (bỏ qua bước của chính người tạo nếu bật AUTO_APPROVE_SELF)
function advanceFrom(r,start){
  let i=start;const L=r.approvers.length;
  while(i<L){
    const a=r.approvers[i];
    const self=AUTO_APPROVE_SELF&&a.email===r.creator_email;
    const dup=r.approvers.slice(0,i).some(p=>p.email===a.email&&p.status==='approved');   // cùng người đã duyệt ở bước trước (vd Đượm vừa là Trưởng phòng vừa ở bước 3)
    if(self||dup){a.status='approved';a.auto=true;a.autoReason=self?'self':'dup';a.at=nowISO();r.history.push({at:a.at,by:a.name,email:a.email,action:'auto',note:self?'người tạo đề nghị':'đã duyệt ở bước trước'});i++;continue;}
    a.status='pending';break;
  }
  if(i>=L){r.status='approved';r.current_step=L;r.history.push({at:nowISO(),by:'TTDCore',email:'',action:'completed',note:''});}
  else{r.status='pending';r.current_step=i;}
}
const flowPatch=r=>({approvers:r.approvers,current_step:r.current_step,status:r.status,history:r.history});

function approveCur(){
  const r=cur;
  openDlg({title:'Duyệt đề nghị thanh toán',sub:`${r.code} · ${fmtMoney(r.total,r.currency)} ${r.currency}`,placeholder:'Ý kiến (không bắt buộc)',okText:'✓ Duyệt',onOk:async note=>{
    showLoading('Đang duyệt…');
    try{
      const res=await mutate(r.id,x=>{
        if(x.status!=='pending')throw new Error('Đề nghị không còn ở trạng thái chờ duyệt.');
        const st=x.approvers[x.current_step];if(!st||st.email!==me())throw new Error('Chưa tới lượt bạn duyệt.');
        st.status='approved';st.at=nowISO();st.note=note;hist(x,'approved',note);
        advanceFrom(x,x.current_step+1);return flowPatch(x);
      });
      cur=res;await afterChange(res.status==='approved'?'Đã duyệt — đề nghị đã duyệt đủ ✓':'Đã duyệt, chuyển cho '+turnOf(res).name);
      notifyFlow(res);
    }catch(e){toast(e.message,4000);}finally{hideLoading();}
  }});
}
function rejectCur(){
  const r=cur;
  openDlg({title:'Từ chối đề nghị',sub:'Người tạo sẽ nhận email kèm lý do.',placeholder:'Lý do từ chối (bắt buộc)',required:true,okText:'✕ Từ chối',danger:true,onOk:async note=>{
    showLoading('Đang lưu…');
    try{
      const res=await mutate(r.id,x=>{
        if(x.status!=='pending')throw new Error('Đề nghị không còn ở trạng thái chờ duyệt.');
        const st=x.approvers[x.current_step];if(!st||st.email!==me())throw new Error('Chưa tới lượt bạn duyệt.');
        st.status='rejected';st.at=nowISO();st.note=note;x.status='rejected';hist(x,'rejected',note);return flowPatch(x);
      });
      cur=res;await afterChange('Đã từ chối.');notifyFlow(res,note);
    }catch(e){toast(e.message,4000);}finally{hideLoading();}
  }});
}
function cancelCur(){
  const r=cur;
  openDlg({title:'Hủy đề nghị này?',sub:'Đề nghị chuyển sang "Đã hủy", vẫn lưu lại để tra cứu.',placeholder:'Lý do hủy (không bắt buộc)',okText:'Hủy đề nghị',danger:true,onOk:async note=>{
    showLoading('Đang hủy…');
    try{
      const res=await mutate(r.id,x=>{if(!['pending','rejected'].includes(x.status))throw new Error('Không thể hủy ở trạng thái này.');x.status='cancelled';hist(x,'cancelled',note);return{status:x.status,history:x.history};});
      cur=res;await afterChange('Đã hủy đề nghị.');
    }catch(e){toast(e.message,4000);}finally{hideLoading();}

}

/* ---------- Đính kèm (Google Drive) ---------- */
function readB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob);});}
function compressImage(file,maxDim=1800,q=0.8){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>maxDim){const s=maxDim/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',q);};img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;});}
async function uploadFiles(r,files){
  const out=[];
  for(let i=0;i<files.length;i++){
    let f=files[i],name=f.name,mime=f.type||'application/octet-stream';
    showLoading(`Đang tải file ${i+1}/${files.length}…\n${name}`);
    if(/^image\//.test(mime)&&f.size>900*1024&&!/gif$/.test(mime)){f=await compressImage(f);mime='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg';}
    if(f.size>25*1024*1024){toast(`"${name}" quá 25MB, bỏ qua.`,4000);continue;}
    const j=await gas({action:'upload',code:r.code,title:r.title,month:String(r.created_at||nowISO()).slice(0,7),fileName:name,mimeType:mime,dataBase64:await readB64(f)});
    out.push({fileId:j.fileId,name:j.name||name,url:j.url,size:j.size||f.size,by:currentUser.name,email:me(),at:nowISO()});
  }
  if(!out.length)return r;
  return mutate(r.id,x=>{x.attachments=(x.attachments||[]).concat(out);hist(x,'attached',out.map(o=>o.name).join(', '));return{attachments:x.attachments,history:x.history};});
}
async function attachToCurrent(input){
  const files=[...(input.files||[])];input.value='';if(!files.length||!cur)return;
  try{const res=await uploadFiles(cur,files);cur=res;await afterChange(`Đã đính kèm ${files.length} file.`);}
  catch(e){toast('Lỗi tải file: '+e.message,5000);}finally{hideLoading();}
}
function removeAtt(fileId){
  const f=(cur.attachments||[]).find(a=>a.fileId===fileId);if(!f)return;
  openDlg({title:'Gỡ file này?',sub:f.name,placeholder:'Ghi chú (không bắt buộc)',okText:'Gỡ file',danger:true,onOk:async()=>{
    showLoading('Đang gỡ…');
    try{
      try{await gas({action:'delete',fileId});}catch(_){}
      const res=await mutate(cur.id,x=>{x.attachments=(x.attachments||[]).filter(a=>a.fileId!==fileId);hist(x,'removed',f.name);return{attachments:x.attachments,history:x.history};});
      cur=res;await afterChange('Đã gỡ file.');
    }catch(e){toast(e.message,4000);}finally{hideLoading();}
  }});
}

function sendMail(to,cc,subject,html){

function notifyFlow(r,reason){
  if(r.status==='pending'){const t=turnOf(r);if(t&&t.email!==me())sendMail([t.email],[],`[TTDCore] Đến lượt anh/chị duyệt: ${r.code} · ${fmtMoney(r.total,r.currency)} ${r.currency}`,mailHtml(r,`⏳ Đến lượt ${t.name} duyệt đề nghị thanh toán`));}
  else if(r.status==='approved'){const acc=(r.approvers||[]).filter(a=>PAY_STEPS.includes(a.stepKey)).map(a=>a.email);sendMail([r.creator_email],acc,`[TTDCore] Đã duyệt xong: ${r.code} — có thể in phiếu`,mailHtml(r,'✅ Đề nghị thanh toán đã được duyệt đủ — có thể in phiếu và chi tiền'));}
  else if(r.status==='rejected'){sendMail([r.creator_email],[],`[TTDCore] Bị từ chối: ${r.code} · ${r.title}`,mailHtml(r,`❌ ${currentUser.name} đã từ chối đề nghị`,`<div style="margin-top:12px;background:#fdecec;color:#991b1b;border-radius:8px;padding:10px 12px"><b>Lý do:</b> ${esc(reason||'')}</div>`));}
}

function fmDelItem(i){if(fm.items.length<=1){fm.items[0]={content:'',amount:0,invoice_no:'',invoice_date:'',due_date:'',note:''};}else fm.items.splice(i,1);fmRenderItems();}
function fmRenderItems(){

function fmTotal(){const t=fm.items.reduce((s,it)=>s+(Number(it.amount)||0),0);$('fTotal').textContent=fmtMoney(t,fm.currency)+' '+fm.currency;$('fWords').textContent=t?moneyWords(t,fm.currency):'—';return fm.currency==='USD'?Math.round(t*100)/100:t;}

function fmRenderFiles(){$('fPend').innerHTML=fm.files.map((f,i)=>{const[b,c]=fileBadge(f.name);return `<div class="file"><span class="fi" style="background:${c}">${b}</span><span style="min-width:0"><div class="fn">${esc(f.name)}</div><div class="fm">${fmtSize(f.size)}</div></span><button class="fx" onclick="fm.files.splice(${i},1);fmRenderFiles()">✕</button></div>`;}).join('');}

function fmCollect(){
  const g=id=>($(id).value||'').trim();
  const items=fm.items.map(it=>({content:(it.content||'').trim(),amount:Number(it.amount)||0,invoice_no:(it.invoice_no||'').trim(),invoice_date:it.invoice_date||'',due_date:it.due_date||'',note:(it.note||'').trim()})).filter(it=>it.content||it.amount);
  const d={title:g('fTitle'),category:g('fCat'),lot_ref:g('fLot')||null,content:g('fContent'),currency:fm.currency,items,total:fmTotal(),requester:g('fRequester'),department:g('fDept')||null,due_date:g('fDue')||null,method:g('fMethod'),beneficiary:g('fBenef'),bank_name:g('fBank')||null,account_no:g('fAcc')||null};
  if(d.method!=='Chuyển khoản'){d.bank_name=null;d.account_no=null;}
  const fl=[...fm.followers].map(e=>({email:e,name:profileName(e)}));
  d.followers=fl;d.follower_emails=fl.map(f=>f.email).join(',');
  let err='';
  if(!d.title)err='Nhập tiêu đề.';else if(!d.category)err='Chọn phân loại thanh toán.';else if(!d.content)err='Nhập nội dung thanh toán.';
  else if(!items.length)err='Nhập ít nhất 1 dòng chi tiết.';else if(items.some(it=>!it.content||!(it.amount>0)))err='Mỗi dòng chi tiết cần có nội dung và số tiền > 0.';
  else if(!d.requester)err='Nhập người đề nghị.';else if(!d.beneficiary)err='Nhập người thụ hưởng.';
  else if(d.method==='Chuyển khoản'&&(!d.bank_name||!d.account_no))err='Chuyển khoản cần ngân hàng và số tài khoản.';
  return{d,err};
}
function freshApprovers(sel){return chain.map((s,i)=>{const o=selOption(s,sel);return{step:i,stepKey:s.key,key:o.key,email:o.email,name:o.name,title:s.title,status:'waiting',at:null,note:''};});}
async function nextCode(){const d=new Date();const ym=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');const prefix=`DNTT-${ym}-`;const last=await DB.lastCode(prefix);const n=last?parseInt(last.slice(prefix.length),10)+1:1;return prefix+String(n).padStart(3,'0');}

async function saveForm(){
  const{d,err}=fmCollect();
  if(err){$('fErr').textContent=err;$('fErr').style.display='block';return;}
  const miss=missingSel(fm.sel);
  if(miss.length){$('fErr').textContent='Chưa có tài khoản của '+miss.join(', ')+' — chọn người duyệt khác hoặc cấu hình email.';$('fErr').style.display='block';return;}
  const sel=Object.assign({},fm.sel);
  $('fmSave').disabled=true;
  try{
    if(fm.mode==='new'){
      showLoading('Đang gửi đề nghị…');
      const files=fm.files.slice();
      const approvers=freshApprovers(sel);
      let rec=null;
      for(let tries=0;tries<5;tries++){
        const t=nowISO();
        rec=Object.assign({id:'pay_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:await nextCode()},d,{
          approvers:JSON.parse(JSON.stringify(approvers)),approver_emails:approvers.map(a=>a.email).join(','),
          current_step:0,status:'pending',comments:[],history:[{at:t,by:currentUser.name,email:me(),action:'created',note:''}],
          print_count:0,creator_name:currentUser.name,creator_email:me(),created_at:t,updated_at:t});
        advanceFrom(rec,0);
        try{await DB.insert(rec);break;}
        catch(e){if(String(e.code)==='23505'||/duplicate/i.test(e.message)){rec=null;continue;}throw e;}
      }
      if(!rec)throw new Error('Không tạo được mã đề nghị, thử lại.');
      closeForm();
      if(files.length){try{rec=await uploadFiles(rec,files);}catch(e){toast('Đã gửi đề nghị nhưng lỗi tải file: '+e.message+' — thêm lại trong chi tiết.',6000);}}
      hideLoading();
      notifyFlow(rec);
      tab='mine';await reload();await openDetail(rec.id);toast('Đã gửi đề nghị '+rec.code);
    }else{
      showLoading('Đang lưu…');
      const wasRejected=cur&&cur.status==='rejected';
      const prevTurn=(turnOf(cur)||{}).email;
      const res=await mutate(fm.id,x=>{
        if(!canEdit(x))throw new Error('Đề nghị đã có người duyệt — không sửa được nữa. Dùng mục Thảo luận để trao đổi.');
        Object.assign(x,d);
        // chưa ai duyệt thật (hoặc đang bị từ chối) → dựng lại chuỗi duyệt theo lựa chọn mới, bắt đầu lại từ bước 1
        x.history=x.history||[];
        hist(x,x.status==='rejected'?'resubmitted':'edited');
        x.approvers=freshApprovers(sel);x.approver_emails=x.approvers.map(a=>a.email).join(',');
        advanceFrom(x,0);
        return Object.assign({},d,{approvers:x.approvers,approver_emails:x.approver_emails,current_step:x.current_step,status:x.status,history:x.history});
      });
      closeForm();cur=res;await afterChange(wasRejected?'Đã gửi lại đề nghị.':'Đã lưu thay đổi.');
      if(wasRejected||(turnOf(res)||{}).email!==prevTurn)notifyFlow(res);
    }
  }catch(e){if($('fErr')){$('fErr').textContent='Lỗi: '+e.message;$('fErr').style.display='block';}else toast('Lỗi: '+e.message,5000);}
  finally{hideLoading();if($('fmSave'))$('fmSave').disabled=false;}
}

function startDemo(){
  $('demobar').hidden=false;
  allProfiles=DEMO_PROFILES.slice();
  resolveChain();
  DB={
    async profiles(){return allProfiles;},
    async list(){return demoRows.filter(canView).map(r=>JSON.parse(JSON.stringify(r))).sort((a,b)=>b.created_at<a.created_at?-1:1);},
    async get(id){const r=demoRows.find(r=>r.id===id);if(!r)throw new Error('Không tìm thấy');return JSON.parse(JSON.stringify(r));},
    async insert(rec){if(demoRows.some(r=>r.code===rec.code))throw Object.assign(new Error('duplicate'),{code:'23505'});demoRows.push(JSON.parse(JSON.stringify(rec)));},
    async update(id,patch,expect){const r=demoRows.find(r=>r.id===id);if(!r||r.updated_at!==expect)return false;Object.assign(r,JSON.parse(JSON.stringify(patch)));return true;},
    async lastCode(prefix){const c=demoRows.map(r=>r.code).filter(c=>c.startsWith(prefix)).sort().pop();return c||null;}
  };
  demoSeed();
  const params=new URLSearchParams(location.search);
  $('demoUser').innerHTML=DEMO_PROFILES.map(p=>`<option value="${p.email}">${p.name} (${p.email.split('@')[0]})</option>`).join('');
  const u=params.get('as')||'vu@ttdglobal.vn';$('demoUser').value=u;
  setDemoUser(u);enterApp();
}
function setDemoUser(email){const p=DEMO_PROFILES.find(p=>p.email===email)||DEMO_PROFILES[0];currentUser={id:p.email,email:p.email,name:p.name,role:p.role};}
async function demoSwitch(email){setDemoUser(email);tab=null;cur=null;showEmptyDetail();$('detail').classList.remove('on');$('who').textContent=currentUser.name+(isAdmin()?' · 👑':'');resolveChain();await reload();toast('Đang xem với tư cách '+currentUser.name);}

init();
</script>

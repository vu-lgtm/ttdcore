<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Hub — TTDCore</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e 0%,#115e59 100%);min-height:100vh;padding:20px;color:#333;}
.container{max-width:1200px;margin:0 auto;background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.1);padding:30px;}
.hidden{display:none !important;}
.login-box{max-width:480px;margin:40px auto;text-align:center;}
.login-box h1{font-size:28px;margin-bottom:8px;}
.login-box p{color:#666;margin-bottom:28px;font-size:14px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid #eee;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.top-bar h1{font-size:22px;}
.top-bar p{color:#888;font-size:13px;margin-top:2px;}
.user-info{display:flex;align-items:center;gap:12px;}
.user-badge{background:linear-gradient(135deg,#0f766e,#115e59);color:white;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;}
.btn{padding:9px 18px;border:2px solid #e0e0e0;background:white;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:all 0.2s;color:#555;}
.btn:hover{border-color:#0f766e;color:#0f766e;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,#0f766e,#115e59);border-color:transparent;color:white;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,118,110,0.3);color:white;}
.btn-danger{color:#c0392b;border-color:#f8d7da;}
.btn-danger:hover{border-color:#c0392b;}
.btn-mini{padding:4px 10px;font-size:11px;border:1px solid #e0e0e0;background:white;border-radius:5px;cursor:pointer;color:#0f766e;font-weight:500;}
.btn-mini:hover{background:#0f766e;color:white;border-color:#0f766e;}
.tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:2px solid #f0f0f0;flex-wrap:wrap;}
.tab{padding:11px 20px;background:transparent;border:none;cursor:pointer;font-size:14px;font-weight:500;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
.tab:hover{color:#0f766e;}
.tab.active{color:#0f766e;border-bottom-color:#0f766e;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;background:white;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#0f766e;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;}
.search-box input:focus{outline:none;border-color:#0f766e;}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.item-card{border:2px solid #eee;border-radius:10px;padding:16px;cursor:pointer;transition:all .18s;background:white;}
.item-card:hover{border-color:#0f766e;transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,118,110,0.1);}
.cat-pill{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;background:#e0f2f1;color:#00695c;}
.status-pill{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;}
.st-active{background:#d4edda;color:#155724;}
.st-prospect{background:#fff3cd;color:#856404;}
.st-inactive{background:#f0f0f0;color:#888;}
.detail-card{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:20px;margin-bottom:16px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.detail-item .d-label{font-size:11px;color:#888;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.detail-item .d-value{font-size:14px;color:#333;font-weight:500;}
.doc-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f9fc;border:1px solid #eee;border-radius:8px;}
.doc-thumb{width:44px;height:44px;border-radius:6px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #eee;font-size:20px;}
.doc-thumb img{width:100%;height:100%;object-fit:cover;}
.doc-name{flex:1;font-size:13px;color:#1976d2;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.doc-name:hover{text-decoration:underline;}
.doc-meta{font-size:11px;color:#999;white-space:nowrap;}
.drop-zone{border:2px dashed #80cbc4;border-radius:10px;padding:18px;text-align:center;background:#f0fdfa;cursor:pointer;transition:all .2s;}
.drop-zone:hover{border-color:#0f766e;background:#e0f2f1;}
.drop-zone.drag{border-color:#0f766e;background:#cce8e4;}
.content-box{font-size:14px;line-height:1.7;color:#444;white-space:pre-wrap;}
.preview-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.preview-backdrop img{max-width:90vw;max-height:85vh;border-radius:8px;}
.preview-backdrop iframe{width:90vw;height:88vh;border:none;border-radius:8px;background:white;}
.preview-close{position:absolute;top:16px;right:20px;color:white;font-size:32px;cursor:pointer;background:none;border:none;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:white;border-radius:12px;padding:28px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;}
.modal h2{font-size:20px;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#0f766e;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:#666;}
.empty-state{text-align:center;padding:60px 20px;color:#999;}
.empty-state .ico{font-size:48px;margin-bottom:12px;}
.back-btn{padding:9px 18px;border:2px solid #e0e0e0;background:white;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;color:#555;margin-bottom:16px;}
.view-toggle{display:flex;border:2px solid #e0e0e0;border-radius:8px;overflow:hidden;}
.view-toggle button{padding:8px 12px;border:none;background:white;cursor:pointer;font-size:15px;color:#888;transition:all .15s;}
.view-toggle button.active{background:#0f766e;color:white;}
.th-table{width:100%;border-collapse:collapse;background:white;border:2px solid #eee;border-radius:10px;overflow:hidden;}
.th-table th{background:#f0fdfa;padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:#0f766e;border-bottom:2px solid #d7f0ec;white-space:nowrap;}
.th-table td{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;}
.th-table tr:last-child td{border-bottom:none;}
.th-table tr:hover td{background:#fafafa;cursor:pointer;}
@media(max-width:768px){.container{padding:16px;}.detail-grid{grid-template-columns:1fr 1fr;}.form-row,.form-row-3{grid-template-columns:1fr;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#80cbc4;border-radius:4px;}
</style>
</head>

<!-- MAIN -->
<div class="container hidden" id="mainApp">
  <div class="top-bar">
    <div><h1>📊 Trading Hub</h1><p>Nghiên cứu thị trường cà phê · Hồ sơ & giấy tờ buyer</p></div>
    <div class="user-info"><span class="user-badge" id="userBadge"></span><button class="btn" onclick="logout()">Đăng xuất</button></div>

  <div class="tabs">
    <button class="tab active" id="tab-reports" onclick="switchTab('reports')">📈 Coffee Report</button>

const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzN1tkdBbiHyiaIDAU20-8NEyTqYoIDL3EfNM3fnGKeZOw1OSA7E-xSlUzkznpUoZT_/exec'; // Apps Script Web App (public)
const UPLOAD_SECRET='ttd_th_2026';                   // phải khớp với Apps Script
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function driveUpload(kind,itemId,itemName,file){
  const dataBase64=await fileToBase64(file);
  const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({secret:UPLOAD_SECRET,action:'upload',kind,itemId,itemName,fileName:file.name,mimeType:file.type,dataBase64})});
  const j=await res.json();
  if(!j.ok)throw new Error(j.error||'Upload thất bại');
  return j;
}
async function driveDelete(fileId){
  if(!fileId)return;
  try{await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({secret:UPLOAD_SECRET,action:'delete',fileId})});}catch(_){}
}

let allReports=[], currentReport=null;
let allBuyers=[], currentBuyer=null;
let allCountries=[], currentCountry=null;
let uploadTarget=null; // {kind:'report'|'buyer'|'country', id}
let viewMode='card'; // 'card' | 'list'
function setView(m){
  viewMode=m;
  document.querySelectorAll('.vt-card').forEach(b=>b.classList.toggle('active',m==='card'));
  document.querySelectorAll('.vt-list').forEach(b=>b.classList.toggle('active',m==='list'));
  renderReports();renderBuyers();renderCountries();
}

function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showLoading(t='Đang tải...'){document.getElementById('loadingText').textContent=t;document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}
function isAdmin(){return currentUser&&(currentUser.role==='admin'||currentUser.email===GRACE_EMAIL);}
function fmtSize(b){if(!b)return'';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
function fmtDate(d){return d?new Date(d).toLocaleDateString('vi-VN'):'';}

// ===== AUTH =====
async function loginWithGoogle(){
  const errEl=document.getElementById('loginError'),btn=document.getElementById('loginBtn');
  errEl.style.display='none';btn.disabled=true;showLoading('Đang chuyển hướng...');
  try{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href,queryParams:{hd:'ttdglobal.vn'}}});if(error)throw error;}
  catch(e){errEl.textContent='Lỗi: '+e.message;errEl.style.display='block';btn.disabled=false;hideLoading();}
}
async function loadCurrentUser(authUser){
  let profile=null;
  const{data:byId}=await sb.from('profiles').select('*').eq('id',authUser.id).single();
  if(byId){profile=byId;}
  else{const{data:byEmail}=await sb.from('profiles').select('*').eq('email',authUser.email).maybeSingle();if(byEmail){await sb.from('profiles').update({id:authUser.id}).eq('email',authUser.email);profile=byEmail;}}
  if(!profile){await sb.auth.signOut();alert('Tài khoản chưa được cấu hình.');return;}
  currentUser={id:authUser.id,email:authUser.email,name:profile.name,role:profile.role};
  showMainApp();
}
async function logout(){await sb.auth.signOut();currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
function showMainApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userBadge').textContent=`${currentUser.name} · ${isAdmin()?'👑 Admin':DEPTS[currentUser.role]||currentUser.role}`;
  loadReports();loadBuyers();loadCountries();
}
function switchTab(t){
  activeTab=t;
  document.getElementById('tab-reports').classList.toggle('active',t==='reports');
  document.getElementById('tab-buyers').classList.toggle('active',t==='buyers');
  document.getElementById('tab-countries').classList.toggle('active',t==='countries');
  document.getElementById('paneReports').classList.toggle('hidden',t!=='reports');
  document.getElementById('paneBuyers').classList.toggle('hidden',t!=='buyers');
  document.getElementById('paneCountries').classList.toggle('hidden',t!=='countries');
}

// ===== FILE UPLOAD (chung) =====
document.getElementById('fileInput').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value='';});
// Cấu hình theo loại (report/buyer/country)
function kindCfg(kind){
  if(kind==='report')return{obj:currentReport,table:'coffee_reports',key:'attachments',nameField:'title',render:renderReportDetail};
  if(kind==='country')return{obj:currentCountry,table:'country_profiles',key:'documents',nameField:'name',render:renderCountryDetail};
  return{obj:currentBuyer,table:'buyer_profiles',key:'documents',nameField:'name',render:renderBuyerDetail};
}
async function handleFiles(files){
  if(!uploadTarget)return;
  const cfg=kindCfg(uploadTarget.kind);
  const itemName=cfg.obj[cfg.nameField]||'';
  for(const file of [...files]){
    if(file.size>MAX_FILE){alert(`File "${file.name}" quá 20MB, bỏ qua.`);continue;}
    showLoading(`Đang tải lên Drive: ${file.name}...`);
    try{
      const r=await driveUpload(uploadTarget.kind,uploadTarget.id,itemName,file);
      const doc={title:r.name||file.name,url:r.url,previewUrl:r.previewUrl,fileId:r.fileId,mime:file.type,size:r.size||file.size,user:currentUser.name,time:Date.now()};
      const list=[...(cfg.obj[cfg.key]||[]),doc];
      await sb.from(cfg.table).update({[cfg.key]:list,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',cfg.obj.id);
      cfg.obj[cfg.key]=list;
    }catch(e){alert(`Lỗi tải "${file.name}": ${e.message}`);}
  }
  hideLoading();cfg.render();
}
function triggerUpload(kind,id){uploadTarget={kind,id};document.getElementById('fileInput').click();}

function docRow(d,kind,idx){
  const isImg=(d.mime||'').startsWith('image/')||/\.(jpg|jpeg|png|gif|webp)$/i.test(d.title||'');
  const isPdf=(d.mime==='application/pdf')||/\.pdf$/i.test(d.title||'');
  const thumb=isImg&&d.url?`<img src="${esc(d.url)}" alt="">`:isPdf?'📕':/\.(docx?|rtf)$/i.test(d.title||'')?'📄':/\.(xlsx?|csv)$/i.test(d.title||'')?'📊':'📎';
  return`<div class="doc-row">
    <div class="doc-thumb">${thumb}</div>
    <span class="doc-name" onclick="previewDoc('${esc(d.previewUrl||d.url)}','${esc(d.url||'')}')">${esc(d.title)}</span>
    <span class="doc-meta">${d.size?fmtSize(d.size):''}${d.user?' · '+esc(d.user):''}</span>
    <button class="btn-mini" style="color:#c0392b;" onclick="removeDoc('${kind}',${idx})">✕</button>
  </div>`;
}
// Drive preview: mọi loại (PDF/ảnh/Word/Excel) đều xem được qua iframe /preview
function previewDoc(previewUrl,openUrl){
  if(!previewUrl){if(openUrl)window.open(openUrl,'_blank');return;}
  document.getElementById('previewContent').innerHTML=`<iframe src="${esc(previewUrl)}"></iframe>`;
  document.getElementById('previewBackdrop').classList.remove('hidden');
}
function closePreview(){document.getElementById('previewBackdrop').classList.add('hidden');document.getElementById('previewContent').innerHTML='';}
async function removeDoc(kind,idx){
  const cfg=kindCfg(kind);const obj=cfg.obj,key=cfg.key;
  const d=(obj[key]||[])[idx];if(!d)return;
  if(!confirm(`Xóa "${d.title}"?`))return;
  showLoading('Đang xóa...');
  try{
    if(d.fileId)await driveDelete(d.fileId);
    else if(d.path)await sb.storage.from('order-files').remove([d.path]);
    const list=[...obj[key]];list.splice(idx,1);
    await sb.from(cfg.table).update({[key]:list,updated_by:currentUser.name,updated_at:new Date().toISOString()}).eq('id',obj.id);
    obj[key]=list;cfg.render();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== COFFEE REPORTS =====
async function loadReports(){
  try{const{data,error}=await sb.from('coffee_reports').select('*').order('created_at',{ascending:false});if(error)throw error;allReports=data||[];renderReports();}
  catch(e){document.getElementById('reportGrid').innerHTML=`<div class="empty-state"><p>Lỗi: ${e.message}</p></div>`;}
}
function renderReports(){
  const g=document.getElementById('reportGrid');
  const s=(document.getElementById('reportSearch').value||'').toLowerCase();
  const cat=document.getElementById('reportCat').value;
  let list=allReports.filter(r=>{
    const ms=!s||[r.title,r.period,r.summary].some(v=>(v||'').toLowerCase().includes(s));
    return ms&&(cat==='all'||r.category===cat);
  });
  g.style.display=viewMode==='list'?'block':'';
  if(!list.length){g.innerHTML='<div class="empty-state"><div class="ico">📈</div><p>Chưa có báo cáo nào</p></div>';return;}
  if(viewMode==='list'){
    g.innerHTML=`<table class="th-table"><thead><tr><th>Tiêu đề</th><th>Loại</th><th>Kỳ</th><th>Tác giả</th><th>Ngày</th><th>📎</th></tr></thead><tbody>${list.map(r=>`
      <tr onclick="openReport('${r.id}')"><td style="font-weight:600;">${esc(r.title)}</td><td><span class="cat-pill">${CAT_LABELS[r.category]||r.category}</span></td><td>${esc(r.period||'—')}</td><td>${esc(r.author||'?')}</td><td>${fmtDate(r.created_at)}</td><td>${(r.attachments||[]).length||''}</td></tr>`).join('')}</tbody></table>`;
    return;
  }
  g.innerHTML=list.map(r=>{
    const n=(r.attachments||[]).length;
    return`<div class="item-card" onclick="openReport('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
        <span class="cat-pill">${CAT_LABELS[r.category]||r.category}</span>
        <span style="font-size:11px;color:#aaa;">${fmtDate(r.created_at)}</span>
      </div>
      <div style="font-size:15px;font-weight:700;color:#333;line-height:1.3;">${esc(r.title)}</div>
      ${r.period?`<div style="font-size:12px;color:#0f766e;margin-top:3px;">🗓 ${esc(r.period)}</div>`:''}
      ${r.summary?`<div style="font-size:12px;color:#888;margin-top:6px;line-height:1.5;max-height:54px;overflow:hidden;">${esc(r.summary)}</div>`:''}
      <div style="font-size:11px;color:#aaa;margin-top:10px;">👤 ${esc(r.author||'?')}${n?` · 📎 ${n} file`:''}</div>
    </div>`;
  }).join('');
}
function openReport(id){currentReport=allReports.find(r=>r.id===id);if(!currentReport)return;document.getElementById('reportsList').classList.add('hidden');document.getElementById('reportDetail').classList.remove('hidden');renderReportDetail();}
function backToReports(){document.getElementById('reportDetail').classList.add('hidden');document.getElementById('reportsList').classList.remove('hidden');currentReport=null;}
function renderReportDetail(){
  const r=currentReport;
  const docs=(r.attachments||[]).map((d,i)=>docRow(d,'report',i)).join('')||'<span style="color:#aaa;font-size:13px;">Chưa có file đính kèm</span>';
  document.getElementById('reportDetailContent').innerHTML=`
    <div class="detail-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
          <span class="cat-pill">${CAT_LABELS[r.category]||r.category}</span>
          <div style="font-size:22px;font-weight:700;margin-top:8px;">${esc(r.title)}</div>
          <div style="font-size:13px;color:#666;margin-top:4px;">${r.period?'🗓 '+esc(r.period)+' · ':''}👤 ${esc(r.author||'?')} · ${fmtDate(r.created_at)}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" onclick="openReportModal('${r.id}')">✏️ Sửa</button>
          ${isAdmin()?`<button class="btn btn-danger" onclick="deleteReport('${r.id}')">🗑️ Xóa</button>`:''}
        </div>
      </div>
      ${r.summary?`<div style="margin-top:14px;padding:12px 14px;background:#f0fdfa;border-left:3px solid #0f766e;border-radius:6px;font-size:13px;color:#444;">${esc(r.summary)}</div>`:''}
    </div>
    ${r.content?`<div class="detail-card"><div style="font-size:12px;font-weight:600;color:#0f766e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">📝 Nội dung</div><div class="content-box">${esc(r.content)}</div></div>`:''}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:12px;font-weight:600;color:#0f766e;text-transform:uppercase;letter-spacing:.5px;">📎 File đính kèm</div>

function openReportModal(id){
  document.getElementById('rError').style.display='none';
  if(id){const r=allReports.find(x=>x.id===id);document.getElementById('reportModalTitle').textContent='Sửa báo cáo';document.getElementById('rEditId').value=id;
    document.getElementById('rTitle').value=r.title||'';document.getElementById('rPeriod').value=r.period||'';document.getElementById('rCat').value=r.category||'market';
    document.getElementById('rSummary').value=r.summary||'';document.getElementById('rContent').value=r.content||'';document.getElementById('rSaveBtn').textContent='Cập nhật';
  }else{document.getElementById('reportModalTitle').textContent='Thêm báo cáo';document.getElementById('rEditId').value='';
    ['rTitle','rPeriod','rSummary','rContent'].forEach(x=>document.getElementById(x).value='');document.getElementById('rCat').value='market';document.getElementById('rSaveBtn').textContent='Lưu';}
  document.getElementById('reportModal').classList.remove('hidden');
}
async function saveReport(){
  const err=document.getElementById('rError');err.style.display='none';
  const title=document.getElementById('rTitle').value.trim();
  if(!title){err.textContent='Vui lòng nhập tiêu đề';err.style.display='block';return;}
  const payload={title,period:document.getElementById('rPeriod').value.trim()||null,category:document.getElementById('rCat').value,
    summary:document.getElementById('rSummary').value.trim()||null,content:document.getElementById('rContent').value.trim()||null,
    updated_by:currentUser.name,updated_at:new Date().toISOString()};
  const id=document.getElementById('rEditId').value;
  const btn=document.getElementById('rSaveBtn');btn.disabled=true;showLoading('Đang lưu...');
  try{
    if(id){await sb.from('coffee_reports').update(payload).eq('id',id);}
    else{payload.id='rpt_'+Date.now()+'_'+Math.floor(Math.random()*9999);payload.author=currentUser.name;payload.author_email=currentUser.email;payload.created_at=new Date().toISOString();payload.attachments=[];await sb.from('coffee_reports').insert(payload);}
    closeModal('reportModal');await loadReports();
    if(id){currentReport=allReports.find(x=>x.id===id);if(!document.getElementById('reportDetail').classList.contains('hidden'))renderReportDetail();}
  }catch(e){err.textContent='Lỗi: '+e.message;err.style.display='block';}finally{btn.disabled=false;hideLoading();}
}
async function deleteReport(id){
  if(!isAdmin()){alert('Chỉ Admin được xóa');return;}
  const r=allReports.find(x=>x.id===id);if(!confirm(`Xóa báo cáo "${r?.title}"?`))return;
  showLoading('Đang xóa...');
  try{
    const paths=(r.attachments||[]).map(a=>a.path).filter(Boolean);if(paths.length)await sb.storage.from('order-files').remove(paths);
    await sb.from('coffee_reports').delete().eq('id',id);backToReports();await loadReports();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

  const btn=document.getElementById('bSaveBtn');btn.disabled=true;showLoading('Đang lưu...');
  try{
    if(id){await sb.from('buyer_profiles').update(payload).eq('id',id);}
    else{payload.id='byr_'+Date.now()+'_'+Math.floor(Math.random()*9999);payload.created_by=currentUser.name;payload.created_at=new Date().toISOString();payload.documents=[];await sb.from('buyer_profiles').insert(payload);}
    closeModal('buyerModal');await loadBuyers();
    if(id){currentBuyer=allBuyers.find(x=>x.id===id);if(!document.getElementById('buyerDetail').classList.contains('hidden'))renderBuyerDetail();}
  }catch(e){err.textContent='Lỗi: '+e.message;err.style.display='block';}finally{btn.disabled=false;hideLoading();}
}
async function deleteBuyer(id){
  if(!isAdmin()){alert('Chỉ Admin được xóa');return;}
  const b=allBuyers.find(x=>x.id===id);if(!confirm(`Xóa buyer "${b?.name}" và toàn bộ giấy tờ?`))return;
  showLoading('Đang xóa...');
  try{
    const paths=(b.documents||[]).map(d=>d.path).filter(Boolean);if(paths.length)await sb.storage.from('order-files').remove(paths);
    await sb.from('buyer_profiles').delete().eq('id',id);backToBuyers();await loadBuyers();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== COUNTRY PROFILES =====
async function loadCountries(){
  try{const{data,error}=await sb.from('country_profiles').select('*').order('name');if(error)throw error;allCountries=data||[];renderCountries();}
  catch(e){document.getElementById('countryGrid').innerHTML=`<div class="empty-state"><p>Lỗi: ${e.message}</p></div>`;}
}
function renderCountries(){
  const g=document.getElementById('countryGrid');
  const s=(document.getElementById('countrySearch').value||'').toLowerCase();
  let list=allCountries.filter(c=>!s||[c.name,c.region].some(v=>(v||'').toLowerCase().includes(s)));
  g.style.display=viewMode==='list'?'block':'';
  if(!list.length){g.innerHTML='<div class="empty-state"><div class="ico">🌍</div><p>Chưa có quốc gia nào</p></div>';return;}
  if(viewMode==='list'){
    g.innerHTML=`<table class="th-table"><thead><tr><th>Quốc gia</th><th>Khu vực</th><th>Tóm tắt</th><th>📎</th></tr></thead><tbody>${list.map(c=>`
      <tr onclick="openCountry('${c.id}')"><td style="font-weight:600;">🌍 ${esc(c.name)}</td><td>${esc(c.region||'—')}</td><td style="color:#888;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.summary||'')}</td><td>${(c.documents||[]).length||''}</td></tr>`).join('')}</tbody></table>`;
    return;
  }
  g.innerHTML=list.map(c=>{
    const n=(c.documents||[]).length;
    return`<div class="item-card" onclick="openCountry('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
        <span style="font-size:22px;">🌍</span>
        ${c.region?`<span class="cat-pill">${esc(c.region)}</span>`:''}
      </div>
      <div style="font-size:16px;font-weight:700;color:#333;line-height:1.3;">${esc(c.name)}</div>
      ${c.summary?`<div style="font-size:12px;color:#888;margin-top:6px;max-height:54px;overflow:hidden;line-height:1.5;">${esc(c.summary)}</div>`:''}
      <div style="font-size:11px;color:#aaa;margin-top:10px;">${n?`📎 ${n} tài liệu`:'Chưa có tài liệu'}</div>
    </div>`;
  }).join('');
}
function openCountry(id){currentCountry=allCountries.find(c=>c.id===id);if(!currentCountry)return;document.getElementById('countriesList').classList.add('hidden');document.getElementById('countryDetail').classList.remove('hidden');renderCountryDetail();}
function backToCountries(){document.getElementById('countryDetail').classList.add('hidden');document.getElementById('countriesList').classList.remove('hidden');currentCountry=null;}
function renderCountryDetail(){
  const c=currentCountry;
  const docs=(c.documents||[]).map((d,i)=>docRow(d,'country',i)).join('')||'<span style="color:#aaa;font-size:13px;">Chưa có tài liệu</span>';
  document.getElementById('countryDetailContent').innerHTML=`
    <div class="detail-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <div>
          <div style="font-size:24px;font-weight:700;">🌍 ${esc(c.name)}</div>
          ${c.region?`<div style="margin-top:6px;"><span class="cat-pill">${esc(c.region)}</span></div>`:''}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" onclick="openCountryModal('${c.id}')">✏️ Sửa</button>
          ${isAdmin()?`<button class="btn btn-danger" onclick="deleteCountry('${c.id}')">🗑️ Xóa</button>`:''}
        </div>
      </div>
      ${c.summary?`<div style="padding:12px 14px;background:#f0fdfa;border-left:3px solid #0f766e;border-radius:6px;font-size:13px;color:#444;white-space:pre-wrap;">${esc(c.summary)}</div>`:''}
      ${c.notes?`<div style="margin-top:10px;font-size:13px;color:#666;white-space:pre-wrap;">${esc(c.notes)}</div>`:''}
    </div>
    <div class="detail-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:12px;font-weight:600;color:#0f766e;text-transform:uppercase;letter-spacing:.5px;">📎 Tài liệu quốc gia</div>
        <button class="btn-mini" onclick="triggerUpload('country','${c.id}')">+ Tải tài liệu lên</button>
      </div>
      <div class="drop-zone" id="countryDrop" onclick="triggerUpload('country','${c.id}')">
        <div style="font-size:28px;">📤</div>
        <div style="font-size:13px;color:#0f766e;font-weight:600;margin-top:4px;">Bấm hoặc kéo tài liệu vào đây</div>
        <div style="font-size:11px;color:#999;margin-top:2px;">PDF, ảnh, Word, Excel · tối đa 20MB</div>
      </div>
      <div class="doc-list" style="margin-top:12px;">${docs}</div>
    </div>`;
  const drop=document.getElementById('countryDrop');
  if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag');});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');uploadTarget={kind:'country',id:c.id};handleFiles(e.dataTransfer.files);});}
}
function openCountryModal(id){
  document.getElementById('cError').style.display='none';
  if(id){const c=allCountries.find(x=>x.id===id);document.getElementById('countryModalTitle').textContent='Sửa quốc gia';document.getElementById('cEditId').value=id;
    document.getElementById('cName').value=c.name||'';document.getElementById('cRegion').value=c.region||'';document.getElementById('cSummary').value=c.summary||'';document.getElementById('cNotes').value=c.notes||'';document.getElementById('cSaveBtn').textContent='Cập nhật';
  }else{document.getElementById('countryModalTitle').textContent='Thêm quốc gia';document.getElementById('cEditId').value='';
    ['cName','cRegion','cSummary','cNotes'].forEach(x=>document.getElementById(x).value='');document.getElementById('cSaveBtn').textContent='Lưu';}
  document.getElementById('countryModal').classList.remove('hidden');
}
async function saveCountry(){
  const err=document.getElementById('cError');err.style.display='none';
  const name=document.getElementById('cName').value.trim();
  if(!name){err.textContent='Vui lòng nhập tên quốc gia';err.style.display='block';return;}
  const payload={name,region:document.getElementById('cRegion').value.trim()||null,summary:document.getElementById('cSummary').value.trim()||null,
    notes:document.getElementById('cNotes').value.trim()||null,updated_by:currentUser.name,updated_at:new Date().toISOString()};
  const id=document.getElementById('cEditId').value;
  const btn=document.getElementById('cSaveBtn');btn.disabled=true;showLoading('Đang lưu...');
  try{
    if(id){await sb.from('country_profiles').update(payload).eq('id',id);}
    else{payload.id='cty_'+Date.now()+'_'+Math.floor(Math.random()*9999);payload.created_by=currentUser.name;payload.created_at=new Date().toISOString();payload.documents=[];await sb.from('country_profiles').insert(payload);}
    closeModal('countryModal');await loadCountries();
    if(id){currentCountry=allCountries.find(x=>x.id===id);if(!document.getElementById('countryDetail').classList.contains('hidden'))renderCountryDetail();}
  }catch(e){err.textContent='Lỗi: '+e.message;err.style.display='block';}finally{btn.disabled=false;hideLoading();}
}
async function deleteCountry(id){
  if(!isAdmin()){alert('Chỉ Admin được xóa');return;}
  const c=allCountries.find(x=>x.id===id);if(!confirm(`Xóa quốc gia "${c?.name}" và toàn bộ tài liệu?`))return;
  showLoading('Đang xóa...');
  try{
    for(const d of (c.documents||[]))if(d.fileId)await driveDelete(d.fileId);
    await sb.from('country_profiles').delete().eq('id',id);backToCountries();await loadCountries();
  }catch(e){alert('Lỗi: '+e.message);}finally{hideLoading();}
}

// ===== INIT =====
(async function init(){
  showLoading('Đang khởi động...');
  try{const{data:{session}}=await sb.auth.getSession();if(session?.user)await loadCurrentUser(session.user);}
  catch(e){console.error(e);}finally{hideLoading();}
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user&&!currentUser){await loadCurrentUser(session.user);}
    if(event==='SIGNED_OUT'){currentUser=null;document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');}
  });
})();
</script>
</body>
</html>
